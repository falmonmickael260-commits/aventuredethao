__def("data/corpus/phrases.js", function (__exports) {
/**
 * Corpus de phrases annotees pour le CE2.
 *
 * Chaque phrase est ecrite dans un petit langage d'annotation compact, ce qui
 * permet de verifier d'un coup d'oeil l'analyse grammaticale complete :
 *
 *   "[ Le|d petit|a chat|n.ms ] dort|v:dormir sur|p le|d canape.|n.ms"
 *
 *   mot|tag          -> un mot et sa nature
 *   [ ... ]          -> delimite le GROUPE SUJET (le reste est le groupe verbal)
 *   ponctuation      -> collee au mot, AVANT la barre : "canape.|n.ms"
 *
 * Tags :
 *   d       determinant
 *   a       adjectif
 *   n.gn    nom commun (g = m|f, n = s|p)   ex: n.ms, n.fp
 *   N.gn    nom propre
 *   v:inf   verbe conjugue, avec son infinitif
 *   p       preposition
 *   r       pronom
 *   A       adverbe
 *   c       conjonction
 *   x       autre / mot volontairement non classe (forme contractee, numeral...)
 *
 * `skip` liste les exercices a ne PAS generer depuis cette phrase quand une
 * reponse serait ambigue pour un eleve de CE2 (ex : "au", "du", "quatre").
 */

const PONCT = '.,;:!?';

/** Decoupe un mot annote "canape.|n.ms" en { w, after, tag }. */
function parseChunk(chunk) {
  const i = chunk.indexOf('|');
  if (i < 0) throw new Error(`Annotation manquante pour "${chunk}"`);
  let w = chunk.slice(0, i);
  const tag = chunk.slice(i + 1);
  let after = '';
  while (w.length && PONCT.includes(w[w.length - 1])) {
    after = w[w.length - 1] + after;
    w = w.slice(0, -1);
  }
  if (!w) throw new Error(`Mot vide dans "${chunk}"`);
  return { w, after, tag };
}

/** Transforme un tag en proprietes de token. */
function readTag(tag, chunk) {
  if (tag === 'd') return { pos: 'det' };
  if (tag === 'a') return { pos: 'adj' };
  if (tag === 'p') return { pos: 'prep' };
  if (tag === 'r') return { pos: 'pronom' };
  if (tag === 'A') return { pos: 'adverbe' };
  if (tag === 'c') return { pos: 'conj' };
  if (tag === 'x') return { pos: 'autre' };
  if (tag.startsWith('v:')) {
    const inf = tag.slice(2);
    if (!inf) throw new Error(`Infinitif manquant dans "${chunk}"`);
    return { pos: 'verbe', inf };
  }
  const m = /^(n|N)\.([mf])([sp])$/.exec(tag);
  if (m) {
    return {
      pos: 'nom',
      kind: m[1] === 'n' ? 'commun' : 'propre',
      genre: m[2],
      nombre: m[3],
    };
  }
  throw new Error(`Tag inconnu "${tag}" dans "${chunk}"`);
}

/** Compile une phrase annotee en objet exploitable. */
function compilePhrase(entry) {
  const tokens = [];
  let sujet = null;
  let open = -1;
  for (const chunk of entry.dsl.trim().split(/\s+/)) {
    if (chunk === '[') {
      open = tokens.length;
      continue;
    }
    if (chunk === ']') {
      if (open < 0) throw new Error(`"]" sans "[" dans ${entry.id}`);
      sujet = [];
      for (let i = open; i < tokens.length; i++) sujet.push(i);
      open = -2;
      continue;
    }
    const { w, after, tag } = parseChunk(chunk);
    const props = readTag(tag, chunk);
    const prev = tokens[tokens.length - 1];
    // Un determinant elide ("L'") se colle au mot suivant.
    const glue = prev && /['’]$/.test(prev.w);
    tokens.push({ w, after, glue: !!glue, ...props });
  }
  if (!sujet) throw new Error(`Groupe sujet non delimite dans ${entry.id}`);

  const texte = tokens
    .map((t, i) => (i === 0 || t.glue ? '' : ' ') + t.w + t.after)
    .join('')
    .trim();

  const gv = tokens.map((_, i) => i).filter((i) => !sujet.includes(i));

  // Personne du sujet : utile pour fabriquer des exercices grammaticalement sûrs.
  let personne = '3s';
  const pron = sujet.map((i) => tokens[i]).find((t) => t.pos === 'pronom');
  if (pron) {
    personne = { je: 'je', j: 'je', tu: 'tu', nous: 'nous', vous: 'vous', il: '3s', elle: '3s', ils: '3p', elles: '3p' }[
      pron.w.toLowerCase()
    ] || '3s';
  } else {
    const tete = sujet.map((i) => tokens[i]).find((t) => t.pos === 'nom');
    personne = tete && tete.nombre === 'p' ? '3p' : '3s';
  }
  const verbe = tokens.findIndex((t) => t.pos === 'verbe');
  if (verbe < 0) throw new Error(`Aucun verbe conjugue dans ${entry.id}`);

  return {
    id: entry.id,
    texte,
    tokens,
    sujet,
    gv,
    verbe,
    personne,
    infinitif: tokens[verbe].inf,
    niveau: entry.niv || 1,
    skip: entry.skip || [],
    theme: entry.theme || 'vie quotidienne',
    noms: tokens.map((t, i) => (t.pos === 'nom' ? i : -1)).filter((i) => i >= 0),
    dets: tokens.map((t, i) => (t.pos === 'det' ? i : -1)).filter((i) => i >= 0),
    propres: tokens
      .map((t, i) => (t.pos === 'nom' && t.kind === 'propre' ? i : -1))
      .filter((i) => i >= 0),
    communs: tokens
      .map((t, i) => (t.pos === 'nom' && t.kind === 'commun' ? i : -1))
      .filter((i) => i >= 0),
  };
}

__def("data/bank/outils.js", function (__exports) {
/**
 * Outils communs aux neuf banques d'exercices.
 *
 * Tous les tirages sont DÉTERMINISTES : la même graine donne toujours la même
 * suite. La banque d'exercices est donc identique d'une session à l'autre,
 * ce qui permet de l'auditer, de la tester et de garder des identifiants
 * stables pour l'historique de Thao.
 */

/** Générateur pseudo-aléatoire déterministe (mulberry32). */
function graine(texte) {
  let h = 2166136261;
  for (let i = 0; i < texte.length; i++) {
    h ^= texte.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  let a = h >>> 0;
  return function next() {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** Mélange une liste de façon déterministe. */
function melanger(liste, cle) {
  const r = graine(cle);
  const out = [...liste];
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(r() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

/** Prend `n` éléments, de façon déterministe. */
function piocher(liste, n, cle) {
  return melanger(liste, cle).slice(0, n);
}

/** Récompense liée à la difficulté. */
function recompense(difficulte) {
  return {
    1: { xp: 10, etoiles: 1 },
    2: { xp: 15, etoiles: 1 },
    3: { xp: 20, etoiles: 2 },
  }[difficulte];
}

/** Tokens d'affichage d'une phrase du corpus. */
function tokensAffichage(phrase) {
  return phrase.tokens.map((t) => ({ w: t.w, after: t.after, glue: t.glue }));
}

/** Transforme une phrase en texte avec des blancs aux indices donnés. */
function texteAvecBlancs(phrase, indices, marque = '____') {
  return phrase.tokens
    .map((t, i) => {
      const mot = indices.includes(i) ? marque : t.w;
      return (i === 0 || t.glue ? '' : ' ') + mot + t.after;
    })
    .join('')
    .trim();
}

/** Construit un exercice en remplissant les champs obligatoires. */
function exercice(def) {
  const manquants = ['id', 'module', 'competence', 'format', 'difficulte', 'type', 'consigne', 'reponse']
    .filter((k) => def[k] === undefined || def[k] === null);
  if (manquants.length) {
    throw new Error(`Exercice incomplet (${def.id || '?'}) : champs manquants ${manquants.join(', ')}`);
  }
  return {
    indice: 'Relis bien la consigne, puis essaie encore.',
    explication: '',
    question: {},
    ...def,
    recompense: def.recompense || recompense(def.difficulte),
  };
}

/** Numérote les identifiants d'une série. */
function idSerie(module, format, i) {
  return `${module}-${format}-${String(i + 1).padStart(2, '0')}`;
}

/** Jolie énumération : « a, b et c ». */
function enumerer(liste) {
  if (liste.length <= 1) return liste.join('');
  return `${liste.slice(0, -1).join(', ')} et ${liste[liste.length - 1]}`;
}

/** Article indéfini correct devant un mot. */
function unUne(nom, genre) {
  return genre === 'f' ? `une ${nom}` : `un ${nom}`;
}

return { graine, melanger, piocher, recompense, tokensAffichage, texteAvecBlancs, exercice, idSerie, enumerer, unUne };
});

    const communs = piocher(NOMS_COMMUNS.map((n) => n.mot), 3, `m2-tri-c-${i}`);
    const placement = {};
    propres.forEach((m) => { placement[m] = 'propres'; });
    communs.forEach((m) => { placement[m] = 'communs'; });
    ex.push(
      exercice({
        id: `m2-tri-${String(i + 1).padStart(2, '0')}`,
        module: M,
        competence: C,
        format: 'tri-propre-commun',
        difficulte: i < 5 ? 1 : 2,
        type: 'colonnes',
        consigne: 'Range chaque nom dans la bonne colonne.',
        question: {
          mots: melanger([...propres, ...communs], `m2-tri-mix-${i}`),
          colonnes: [
            { id: 'propres', titre: 'Noms propres', aide: 'une seule personne, un seul lieu' },
            { id: 'communs', titre: 'Noms communs', aide: 'toutes les choses de la même sorte' },
          ],
        },
        reponse: { placement, bravo: 'Parfait, les deux colonnes sont justes !' },
        indice: 'La majuscule est un indice très utile… mais réfléchis aussi au sens du mot.',
        explication: `Noms propres : ${enumerer(propres)}. Noms communs : ${enumerer(communs)}.`,
      }),

  avecPropres.slice(0, 8).forEach((p, i) => {
    ex.push(
      exercice({
        id: `m2-propres-phrase-${String(i + 1).padStart(2, '0')}`,
        module: M,
        competence: C,
        format: 'propres-dans-phrase',
        difficulte: p.propres.length > 1 ? 3 : i < 4 ? 1 : 2,
        type: 'clic-mots',
        consigne: 'Clique sur tous les noms propres de cette phrase.',
        question: { phrase: p.texte, tokens: tokensAffichage(p), source: p.id },
        reponse: {
          indices: p.propres,
          bravo: 'Bien vu Thao ! Les noms propres n’ont aucun secret pour toi.',
        },
        indice: 'Cherche les majuscules à l’intérieur de la phrase (pas celle du tout premier mot !).',
        explication: `Nom${p.propres.length > 1 ? 's' : ''} propre${p.propres.length > 1 ? 's' : ''} : ${enumerer(p.propres.map((j) => p.tokens[j].w))}.`,
      }),
    );
  });

  avecPropres
    .filter((p) => p.communs.length >= 1)
    .slice(0, 6)
    .forEach((p, i) => {
      ex.push(
        exercice({
          id: `m2-communs-phrase-${String(i + 1).padStart(2, '0')}`,
          module: M,
          competence: C,
          format: 'communs-dans-phrase',
          difficulte: 2,
          type: 'clic-mots',
          consigne: 'Clique seulement sur les noms COMMUNS de cette phrase.',
          question: { phrase: p.texte, tokens: tokensAffichage(p), source: p.id },
          reponse: {
            indices: p.communs,
            bravo: 'Très bien ! Tu as laissé les noms propres de côté.',
          },
          indice: 'Les noms propres ont une majuscule : ne clique pas dessus cette fois-ci.',
          explication: `Noms communs : ${enumerer(p.communs.map((j) => p.tokens[j].w))}. Ils ne prennent pas de majuscule.`,
        }),
      );
    });

  /* ---- D. Écris un nom propre / un nom commun ---------------------- */
  const consignesPropres = [
    { id: 1, texte: 'Écris le prénom d’une personne de ta famille ou d’un ami. C’est un nom propre !', aide: 'prénom' },
    { id: 2, texte: 'Écris le nom d’une ville que tu connais.', aide: 'ville' },
    { id: 3, texte: 'Écris le nom d’un pays.', aide: 'pays' },
  ];
  consignesPropres.forEach((c, i) => {
    ex.push(
      exercice({
        id: `m2-ecris-propre-${String(i + 1).padStart(2, '0')}`,
        module: M,
        competence: C,
        format: 'ecris-propre',
        difficulte: 2,
        type: 'phrase',
        consigne: c.texte,
        question: { court: true, exemple: 'Un seul mot, avec une MAJUSCULE au début.' },
        reponse: {
          regles: [
            { type: 'motUnique', message: 'Écris un seul mot, s’il te plaît.' },
            { type: 'lettresSeules', message: 'Utilise seulement des lettres (pas de chiffre, pas de symbole).' },
            { type: 'minLettres', n: 2, message: 'C’est un peu court : écris le nom en entier.' },
            { type: 'majuscule', message: 'Un nom propre commence TOUJOURS par une majuscule.' },
            { type: 'pasDansListe', mots: MOTS_COMMUNS_CONNUS, message: 'Ce mot est un nom commun. Un nom propre désigne une seule personne ou un seul lieu.' },
          ],
          bravo: 'Super ! Majuscule bien placée : c’est un vrai nom propre.',
          solution: { prénom: 'Camille', ville: 'Lyon', pays: 'Italie' }[c.aide],
        },
        indice: 'Un nom propre désigne UNE SEULE personne ou UN SEUL lieu, et il commence par une majuscule.',
        explication: 'Les noms propres gardent leur majuscule partout dans la phrase : Thao, Lyon, la Loire, Mars…',
      }),
    );
  });

  [
    { cle: 'animaux', texte: 'Écris un nom commun qui désigne un animal.' },
    { cle: 'classe', texte: 'Écris un nom commun qui désigne un objet de la classe.' },
    { cle: 'aliments', texte: 'Écris un nom commun qui désigne quelque chose qui se mange.' },
  ].forEach((c, i) => {
    ex.push(
      exercice({
        id: `m2-ecris-commun-${String(i + 1).padStart(2, '0')}`,
        module: M,
        competence: C,
        format: 'ecris-commun',
        difficulte: 2,
        type: 'phrase',
        consigne: c.texte,
        question: { court: true, exemple: 'Un seul mot, sans majuscule.' },
        reponse: {
          regles: [
            { type: 'motUnique', message: 'Un seul mot suffit.' },
            { type: 'unDe', mots: LISTES_COMMUNS[c.cle], message: `Hmm, ce mot ne va pas ici. Pense à ${c.cle === 'animaux' ? 'un animal que tu connais' : c.cle === 'classe' ? 'ce qu’il y a dans ta trousse' : 'ce que tu manges au goûter'}.` },
            { type: 'pasDansListe', mots: NOMS_PROPRES.map((n) => n.mot), message: 'Attention, c’est un nom propre. Ici, on cherche un nom commun.' },
          ],
          bravo: 'Oui ! C’est bien un nom commun.',
          solution: LISTES_COMMUNS[c.cle][0],
        },
        indice: 'Un nom commun ne prend pas de majuscule et désigne toutes les choses de la même sorte.',
        explication: 'Un nom commun peut être précédé d’un déterminant : un chat, le crayon, des pommes.',
      }),
    );
  });

  /* ---- E. Vrai ou faux ? (corriger un classement) ------------------ */
  const pourVF = melanger(PHRASES.filter((p) => p.propres.length && p.communs.length), 'm2-vf');
  for (let i = 0; i < 8; i++) {
    const p = pourVF[i % pourVF.length];
    const vrai = i % 2 === 0;
    const motPropre = p.tokens[p.propres[0]].w;
    const motCommun = p.tokens[p.communs[0]].w;
    const mot = vrai ? motPropre : motCommun;
    ex.push(
      exercice({
        id: `m2-vf-${String(i + 1).padStart(2, '0')}`,
        module: M,
        competence: C,
        format: 'corrige-classement',
        difficulte: i < 4 ? 2 : 3,
        type: 'vrai-faux',
        consigne: 'Lis la phrase, puis dis si l’affirmation est vraie ou fausse.',
        question: {
          phrase: p.texte,
          affirmation: `Dans cette phrase, « ${mot} » est un nom propre.`,
          source: p.id,
        },
        reponse: {
          valeur: vrai,
          bravo: vrai ? 'Oui, bien vu !' : 'Bien joué, tu ne t’es pas laissé piéger !',
          rate: vrai
            ? `Si, « ${mot} » est un nom propre : il désigne une seule personne ou un seul lieu, et il garde sa majuscule.`
            : `Non : « ${mot} » est un nom commun. Le nom propre de cette phrase, c’est « ${motPropre} ».`,
        },
        indice: 'Un nom propre désigne quelqu’un ou quelque part en particulier, et il a une majuscule.',
        explication: `Dans « ${p.texte} », le nom propre est « ${motPropre} » et « ${motCommun} » est un nom commun.`,
      }),
    );
  }

  /* ---- F. Pourquoi cette majuscule ? ------------------------------- */
  const pourMaj = melanger(PHRASES.filter((p) => p.propres.length && !p.propres.includes(0)), 'm2-maj').slice(0, 5);
  pourMaj.forEach((p, i) => {
    const mot = p.tokens[p.propres[0]].w;
    ex.push(
      exercice({
        id: `m2-majuscule-${String(i + 1).padStart(2, '0')}`,
        module: M,
        competence: C,
        format: 'pourquoi-majuscule',
        difficulte: i < 3 ? 1 : 2,
        type: 'choix',
        consigne: `Pourquoi « ${mot} » prend-il une majuscule au milieu de la phrase ?`,
        question: {
          phrase: p.texte,
          options: [
            'Parce que c’est un nom propre.',
            'Parce que c’est le premier mot de la phrase.',
            'Parce que c’est un nom commun important.',
          ],
          source: p.id,
        },
        reponse: {
          index: 0,
          bravo: 'Exactement ! La majuscule est la marque du nom propre.',
          rate: `« ${mot} » n’est pas au début de la phrase, et pourtant il a une majuscule : c’est donc un nom propre.`,
        },
        indice: 'Le premier mot de la phrase a déjà sa majuscule. Ce mot-là en a une pour une autre raison.',
        explication: `« ${mot} » désigne une seule personne ou un seul lieu : c’est un nom propre, il garde sa majuscule partout.`,
      }),
    );
  });

  return ex;

/**
 * MODULE 3 — Accorder le nom et le déterminant.
 *
 * Toutes les formes du pluriel sont lues dans le corpus (« un cheval → des
 * chevaux »), et toutes les formes d'adjectifs viennent d'une table à quatre

const M = 'm3';
const C = 'm3';

const MAJ = (s) => s[0].toUpperCase() + s.slice(1);

/**
 * Adjectifs dont la forme CHANGE entre singulier et pluriel pour ce genre.
 * Indispensable : avec « gros » ou « vieux » au masculin, la marque du pluriel
 * ne se voit pas, et un exercice « trouve le mot mal accordé » n'aurait alors
 * aucune réponse visible.
 */
function adjQuiVarie(nom) {
  return ADJECTIFS.filter(
    (a) => a[`${nom.genre}s`] !== a[`${nom.genre}p`] && (!a.anime || nom.anime),
  );
}

/** Un adjectif qui va avec ce nom (un chou n'est pas « gentil »). */
function adjPour(nom, i) {
  const ok = ADJECTIFS.filter((a) => !a.anime || nom.anime);
  return ok[i % ok.length];
}

/** Construit un groupe nominal correct : déterminant + adjectif + nom. */
function groupe(det, adj, nom, gn) {

  const motAdj = adj[gn];
  return adj.place === 'avant'
    ? `${det} ${motAdj} ${motNom}`
    : `${det} ${motNom} ${motAdj}`;
}

function construireM3() {
  const ex = [];
  const noms = NOMS_NON_ELIDES;

  /* ---- A. Quel déterminant va avec ce nom ? ------------------------ */
  const pourChoix = piocher(noms, 14, 'm3-choix');
  pourChoix.forEach((n, i) => {
    const serie = SERIES_DET[i % SERIES_DET.length];
    const pluriel = i % 3 === 2 && n.pluriel !== n.mot;
    const gn = `${n.genre}${pluriel ? 'p' : 's'}`;
    const mot = pluriel ? n.pluriel : n.mot;
    const options = [...new Set([serie.ms, serie.fs, serie.mp])];
    const bon = serie[gn];
    ex.push(
      exercice({
        id: `m3-choisis-det-${String(i + 1).padStart(2, '0')}`,
        module: M,
        competence: C,
        format: 'choisis-det',
        difficulte: pluriel ? 2 : 1,
        type: 'choix',
        consigne: `Choisis le déterminant qui va avec « ${mot} ».`,
        question: { trou: `_____ ${mot}`, options, serie: serie.libelle },
        reponse: {
          index: options.indexOf(bon),
          bravo: 'Bien accordé !',
          rate: `« ${mot} » est ${n.genre === 'f' ? 'féminin' : 'masculin'} ${pluriel ? 'pluriel' : 'singulier'} : il lui faut « ${bon} ».`,
        },
        indice: `Demande-toi : est-ce que je dis « un ${n.mot} » ou « une ${n.mot} » ? Et y en a-t-il un seul ou plusieurs ?`,
        explication: `On écrit « ${bon} ${mot} » : ${n.genre === 'f' ? 'féminin' : 'masculin'}, ${pluriel ? 'pluriel' : 'singulier'}.`,
      }),
    );
  });

  /* ---- B. Passe au pluriel ----------------------------------------- */
  const pourPluriel = piocher(noms.filter((n) => n.pluriel !== n.mot), 12, 'm3-pluriel');
  pourPluriel.forEach((n, i) => {
    const defini = i % 2 === 0;
    const det = defini ? (n.genre === 'f' ? 'la' : 'le') : n.genre === 'f' ? 'une' : 'un';
    const attendus = [`des ${n.pluriel}`, `les ${n.pluriel}`];
    const special = !n.pluriel.endsWith('s') || n.pluriel.endsWith('aux') || n.pluriel.endsWith('oux');
    ex.push(
      exercice({
        id: `m3-pluriel-${String(i + 1).padStart(2, '0')}`,
        module: M,
        competence: C,
        format: 'pluriel',
        difficulte: special ? 3 : 1,
        type: 'texte',
        consigne: 'Écris ce groupe de mots au pluriel.',
        question: { depart: `${det} ${n.mot}`, exemple: 'un chat → des chats', court: true },
        reponse: {
          attendus,
          bravo: 'Parfait, le déterminant ET le nom sont au pluriel !',
          rate: 'Attention : au pluriel, le déterminant change ET le nom change.',
        },
        indice: special
          ? `Ce nom a un pluriel spécial. Il ne prend pas simplement un -s. Essaie de le dire à voix haute : « des… »`
          : 'Au pluriel, « un » devient « des », « le » devient « les », et le nom prend un -s.',
        explication: `${det} ${n.mot} → des ${n.pluriel}${special ? ' (pluriel spécial : ce nom ne prend pas un simple -s)' : ''}.`,
      }),
    );
  });

  const pourSing = piocher(noms.filter((n) => n.pluriel !== n.mot), 10, 'm3-sing');
  pourSing.forEach((n, i) => {
    const det = i % 2 === 0 ? 'les' : 'des';
    const attendus = [
      `${n.genre === 'f' ? 'la' : 'le'} ${n.mot}`,
      `${n.genre === 'f' ? 'une' : 'un'} ${n.mot}`,
    ];
    ex.push(
      exercice({
        id: `m3-singulier-${String(i + 1).padStart(2, '0')}`,
        module: M,
        competence: C,
        format: 'singulier',
        difficulte: i < 3 ? 1 : 2,
        type: 'texte',
        consigne: 'Écris ce groupe de mots au singulier.',
        question: { depart: `${det} ${n.pluriel}`, exemple: 'des chats → un chat', court: true },
        reponse: {
          attendus,
          bravo: 'Très bien ! Tout est revenu au singulier.',
          rate: 'Le nom aussi doit revenir au singulier, pas seulement le déterminant.',
        },
        indice: `Il n’y en a plus qu’un seul. Dis-tu « un ${n.mot} » ou « une ${n.mot} » ?`,
        explication: `${det} ${n.pluriel} → ${attendus[0]} (ou « ${attendus[1]} »).`,
      }),
    );
  });

  /* ---- D. Corrige le groupe mal accordé ---------------------------- */
  const pourCorr = piocher(noms.filter((n) => n.pluriel !== n.mot), 10, 'm3-corr');
  pourCorr.forEach((n, i) => {
    const adj = adjPour(n, i);
    const gns = `${n.genre}s`;
    const gnp = `${n.genre}p`;

    const versPluriel = MAJ(groupe(detP.toLowerCase(), adj, n, gnp));
    ex.push(
      exercice({
        id: `m3-corrige-${String(i + 1).padStart(2, '0')}`,
        module: M,
        competence: C,
        format: 'corrige-groupe',
        difficulte: 3,
        type: 'phrase',
        consigne: 'Ce groupe de mots est mal accordé. Réécris-le correctement.',
        question: { faux, court: true, exemple: 'Deux corrections sont possibles : tout au singulier, ou tout au pluriel.' },
        reponse: {
          regles: [
            {
              type: 'phraseExacte',
              mots: [versSingulier, versPluriel],
              message: `Il faut que les TROIS mots s’accordent ensemble : soit « ${versSingulier} », soit « ${versPluriel} ».`,
            },
          ],
          bravo: 'Bravo ! Les trois mots s’accordent maintenant.',
          solution: versPluriel,
        },
        indice: `Si tu gardes « ${detP} », le nom et l’adjectif doivent aussi passer au pluriel. Si tu préfères « ${detS} », tout reste au singulier.`,
        explication: `« ${faux} » est faux. Les deux corrections possibles : « ${versSingulier} » ou « ${versPluriel} ».`,
      }),

    const pluriel = i % 2 === 0;
    const gn = `${n.genre}${pluriel ? 'p' : 's'}`;

      exercice({
        id: `m3-detecte-${String(i + 1).padStart(2, '0')}`,
        module: M,
        competence: C,
        format: 'detecte-erreur',
        difficulte: 3,
        type: 'clic-mots',
        consigne: 'Un seul mot est mal accordé. Clique dessus.',
        question: {
          phrase: mots.join(' '),
          tokens: mots.map((w, j) => ({ w, after: j === mots.length - 1 ? '.' : '', glue: false })),
        },
        reponse: {
          indices: [indexFaux],
          bravo: 'Œil de lynx ! C’était bien ce mot-là.',
        },
        indice: `Le déterminant « ${det} » donne le ton : tout le groupe doit être au ${pluriel ? 'pluriel' : 'singulier'}.`,
        explication: `« ${mots[indexFaux]} » est mal accordé : il faut écrire « ${bonne} », car le groupe est au ${pluriel ? 'pluriel' : 'singulier'}.`,
      }),
    );
  });

    const choix = piocher(noms.filter((n) => n.pluriel !== n.mot), 6, `m3-tri-${i}`);
    const placement = {};
    const mots = choix.map((n, j) => {
      const pluriel = j % 2 === 0;
      const g = pluriel
        ? `des ${n.pluriel}`
        : `${n.genre === 'f' ? 'une' : 'un'} ${n.mot}`;
      placement[g] = pluriel ? 'pluriel' : 'singulier';
      return g;
    });
    ex.push(
      exercice({
        id: `m3-tri-nombre-${String(i + 1).padStart(2, '0')}`,
        module: M,
        competence: C,
        format: 'tri-sing-plur',
        difficulte: i < 4 ? 1 : 2,
        type: 'colonnes',
        consigne: 'Range chaque groupe dans la bonne colonne.',
        question: {
          mots: melanger(mots, `m3-tri-mix-${i}`),
          colonnes: [
            { id: 'singulier', titre: 'Singulier', aide: 'un seul' },
            { id: 'pluriel', titre: 'Pluriel', aide: 'plusieurs' },
          ],
        },
        reponse: { placement, bravo: 'Tout est bien rangé !' },
        indice: 'Regarde le déterminant : « un », « une », « le », « la » → singulier. « des », « les » → pluriel.',
        explication: 'Le déterminant et le nom portent tous les deux la marque du nombre.',
      }),
    );
  }

  /* ---- G. Quelle phrase est bien accordée ? ------------------------ */
  const pourPhrase = piocher(noms.filter((n) => n.pluriel !== n.mot), 8, 'm3-phrase');
  pourPhrase.forEach((n, i) => {
    const varies = adjQuiVarie(n);
    const adj = varies[(i + 7) % varies.length];
    const gnp = `${n.genre}p`;
    const gns = `${n.genre}s`;
    const juste = MAJ(`${groupe('les', adj, n, gnp)} sont là.`);
    const faux1 = MAJ(`${groupe('les', adj, n, gns)} sont là.`);
    const faux2 = MAJ(`${adj.place === 'avant' ? `les ${adj[gnp]} ${n.mot}` : `les ${n.mot} ${adj[gnp]}`} sont là.`);
    const options = melanger([juste, faux1, faux2], `m3-ph-${i}`);
    ex.push(
      exercice({
        id: `m3-bonne-phrase-${String(i + 1).padStart(2, '0')}`,
        module: M,
        competence: C,
        format: 'accord-phrase',
        difficulte: 3,
        type: 'choix',

__def("data/bank/m4.js", function (__exports) {
/**
 * MODULE 4 — Le groupe sujet et le groupe verbal.
 *
 * Le découpage sujet / groupe verbal est celui du corpus annoté : le groupe
 * verbal est TOUT ce qui n'est pas le groupe sujet (le verbe et ce qui le
 * complète), comme on l'enseigne au CE2.
 */

const { PHRASES } = __charger("data/corpus/phrases.js");
const { exercice, melanger, tokensAffichage } = __charger("data/bank/outils.js");

const M = 'm4';
const C = 'm4';

/** Texte d'un groupe de tokens, apostrophes collées. */
function texteGroupe(p, indices) {
  return indices
    .map((i, k) => (k === 0 || p.tokens[i].glue ? '' : ' ') + p.tokens[i].w + (k === indices.length - 1 ? '' : p.tokens[i].after))
    .join('')
    .trim();
}

/** Formes verbales conjuguées du corpus (servent de liste interdite). */
const FORMES_VERBALES = [...new Set(PHRASES.map((p) => p.tokens[p.verbe].w.toLowerCase()))];

/** Groupes de 4 phrases dont les sujets sont clairement différents :
 *  un seul appariement a du sens, l'exercice « relie » est donc sans ambiguïté. */
const GROUPES_PAIRES = [
  ['p012', 'p007', 'p019', 'p033'],
  ['p001', 'p011', 'p018', 'p040'],
  ['p023', 'p049', 'p061', 'p080'],
  ['p027', 'p017', 'p041', 'p054'],
  ['p015', 'p086', 'p005', 'p052'],
  ['p044', 'p068', 'p071', 'p084'],
];

function construireM4() {
  const ex = [];
  const parId = Object.fromEntries(PHRASES.map((p) => [p.id, p]));

  /* ---- A. Clique sur le groupe sujet ------------------------------- */
  const pourSujet = melanger(PHRASES, 'm4-sujet');
  pourSujet.slice(0, 18).forEach((p, i) => {
    ex.push(
      exercice({
        id: `m4-clic-sujet-${String(i + 1).padStart(2, '0')}`,
        module: M,
        competence: C,
        format: 'clic-sujet',
        difficulte: p.sujet.length >= 3 ? 3 : p.sujet.length === 1 ? 1 : 2,
        type: 'clic-mots',
        consigne: 'Clique sur tous les mots du groupe sujet.',
        question: { phrase: p.texte, tokens: tokensAffichage(p), source: p.id },
        reponse: {
          indices: p.sujet,
          bravo: 'Bravo Thao ! C’est bien de ça qu’on parle dans la phrase.',
        },
        indice: 'Demande-toi : « De qui ou de quoi parle-t-on ? ». Tu peux aussi essayer « C’est … qui … ».',
        explication: `Groupe sujet : « ${texteGroupe(p, p.sujet)} ». On peut dire : « C’est ${texteGroupe(p, p.sujet).toLowerCase()} qui ${texteGroupe(p, p.gv)} ».`,
      }),
    );
  });

  /* ---- B. Clique sur le groupe verbal ------------------------------ */
  const pourGv = melanger(PHRASES, 'm4-gv');
  pourGv.slice(0, 14).forEach((p, i) => {
    ex.push(
      exercice({
        id: `m4-clic-gv-${String(i + 1).padStart(2, '0')}`,
        module: M,
        competence: C,
        format: 'clic-gv',
        difficulte: p.gv.length >= 5 ? 3 : p.gv.length <= 3 ? 1 : 2,
        type: 'clic-mots',
        consigne: 'Clique sur tous les mots du groupe verbal.',
        question: { phrase: p.texte, tokens: tokensAffichage(p), source: p.id },
        reponse: {
          indices: p.gv,
          bravo: 'Parfait ! Tu as pris le verbe et tout ce qui le complète.',
        },
        indice: 'Le groupe verbal, c’est tout ce qui RESTE quand on a enlevé le groupe sujet : le verbe et ce qui le complète.',
        explication: `Groupe sujet : « ${texteGroupe(p, p.sujet)} ». Groupe verbal : « ${texteGroupe(p, p.gv)} ».`,
      }),
    );
  });

  /* ---- C. Coupe la phrase en deux ---------------------------------- */
  melanger(PHRASES.filter((p) => p.sujet.length >= 2), 'm4-coupe')
    .slice(0, 8)
    .forEach((p, i) => {
      ex.push(
        exercice({
          id: `m4-coupe-${String(i + 1).padStart(2, '0')}`,
          module: M,
          competence: C,
          format: 'coupe',
          difficulte: p.tokens.length <= 6 ? 1 : 2,
          type: 'coupe-phrase',
          consigne: 'Clique entre deux mots pour séparer le groupe sujet du groupe verbal.',
          question: { phrase: p.texte, tokens: tokensAffichage(p), source: p.id },
          reponse: {
            coupe: p.sujet.length,
            bravo: 'Coupure parfaite ! À gauche le sujet, à droite le groupe verbal.',
          },
          indice: 'La coupure se place juste avant le verbe.',
          explication: `« ${texteGroupe(p, p.sujet)} » / « ${texteGroupe(p, p.gv)} ».`,
        }),
      );
    });

  /* ---- D. Relie le sujet et son groupe verbal ---------------------- */
  GROUPES_PAIRES.forEach((ids, i) => {
    const phrases = ids.map((id) => parId[id]);
    const gauche = phrases.map((p, k) => ({ id: `s${k}`, texte: texteGroupe(p, p.sujet) }));
    const droite = melanger(
      phrases.map((p, k) => ({ id: `v${k}`, texte: texteGroupe(p, p.gv) })),
      `m4-paires-${i}`,
    );
    const paires = {};
    phrases.forEach((_, k) => { paires[`s${k}`] = `v${k}`; });
    ex.push(
      exercice({
        id: `m4-relie-${String(i + 1).padStart(2, '0')}`,
        module: M,
        competence: C,
        format: 'associe-sujet-gv',
        difficulte: i < 2 ? 1 : 2,
        type: 'paires',
        consigne: 'Relie chaque groupe sujet au groupe verbal qui lui va.',
        question: { gauche, droite, titreGauche: 'Groupes sujets', titreDroite: 'Groupes verbaux' },
        reponse: { paires, bravo: 'Toutes les phrases sont reconstituées !' },
        indice: 'Lis la phrase entière dans ta tête : est-ce que ça veut dire quelque chose ?',
        explication: phrases.map((p) => `• ${p.texte}`).join('\n'),
      }),
    );
  });

  /* ---- E. Complète avec un groupe sujet ---------------------------- */
  melanger(PHRASES.filter((p) => p.personne === '3s' && p.sujet.length >= 2), 'm4-complete')
    .slice(0, 6)
    .forEach((p, i) => {
      const gv = texteGroupe(p, p.gv);
      ex.push(
        exercice({
          id: `m4-complete-sujet-${String(i + 1).padStart(2, '0')}`,
          module: M,
          competence: C,
          format: 'complete-sujet',
          difficulte: 3,
          type: 'phrase',
          consigne: 'Invente un groupe sujet pour compléter cette phrase.',
          question: {
            texteTrous: `_________ ${gv}.`,
            court: true,
            exemple: 'Par exemple : « Le gros dragon », « Ma voisine », « Trois enfants »…',
          },
          reponse: {
            regles: [
              { type: 'minMots', n: 2, message: 'Écris un vrai groupe sujet : un déterminant et un nom, par exemple « Le chien ».' },
              { type: 'pasDansListe', mots: FORMES_VERBALES, message: 'Ton groupe sujet ne doit pas contenir de verbe conjugué : le verbe est déjà dans la phrase.' },
              { type: 'lettresSeules', message: 'Utilise seulement des lettres.' },
              { type: 'majuscule', message: 'La phrase commence par une majuscule.' },
            ],
            bravo: 'Super groupe sujet ! Ta phrase est complète.',
            solution: texteGroupe(p, p.sujet),
          },
          indice: 'Un groupe sujet contient souvent un déterminant et un nom : « le chat », « mon frère », « la vieille sorcière ».',
          explication: `Dans la phrase d’origine, le groupe sujet était « ${texteGroupe(p, p.sujet)} ». Mais beaucoup d’autres réponses sont possibles !`,
        }),
      );
    });

  /* ---- F. Remets la phrase dans l'ordre ---------------------------- */
  melanger(PHRASES.filter((p) => p.tokens.length >= 4 && p.tokens.length <= 6 && !p.tokens.some((t) => t.glue)), 'm4-ordre')
    .slice(0, 5)
    .forEach((p, i) => {
      const bon = p.tokens.map((t) => t.w);
      let brouille = melanger(bon, `m4-brouille-${i}`);
      if (brouille.join(' ') === bon.join(' ')) brouille = [...bon].reverse();
      ex.push(
        exercice({
          id: `m4-remets-ordre-${String(i + 1).padStart(2, '0')}`,
          module: M,
          competence: C,
          format: 'remets-ordre',
          difficulte: 3,
          type: 'ordre',
          consigne: 'Remets les mots dans l’ordre pour reconstruire la phrase.',
          question: { mots: brouille, source: p.id },
          reponse: { ordre: bon, bravo: 'La phrase est reconstruite !' },
          indice: 'Commence par le groupe sujet (de qui on parle), puis place le verbe, puis la fin.',
          explication: `La phrase était : « ${p.texte} ».`,
        }),
      );
    });

  /* ---- G. Invente une phrase complète ------------------------------ */
  const sujets = [
    { sujet: 'Le petit dragon', verbe: 'vole', aide: 'au-dessus du château' },
    { sujet: 'Ma sœur', verbe: 'dessine', aide: 'un bateau' },
    { sujet: 'Les pirates', verbe: 'cherchent', aide: 'un trésor' },
    { sujet: 'Le robot', verbe: 'range', aide: 'la cuisine' },
  ];
  sujets.forEach((s, i) => {
    ex.push(
      exercice({
        id: `m4-invente-${String(i + 1).padStart(2, '0')}`,
        module: M,
        competence: C,
        format: 'invente-phrase',
        difficulte: 3,
        type: 'phrase',
        consigne: `Invente une phrase complète avec le groupe sujet « ${s.sujet} » et le verbe « ${s.verbe} ».`,
        question: {
          exemple: `Par exemple : « ${s.sujet} ${s.verbe} ${s.aide}. »`,
          aide: 'N’oublie pas la majuscule au début et le point à la fin !',
        },
        reponse: {
          regles: [
            { type: 'contient', mots: [s.sujet.split(' ').pop()], message: `Ta phrase doit contenir le groupe sujet « ${s.sujet} ».` },
            { type: 'contient', mots: [s.verbe], message: `Ta phrase doit contenir le verbe « ${s.verbe} ».` },
            { type: 'ordre', avant: s.sujet.split(' ').pop(), apres: s.verbe, message: 'Le groupe sujet se place avant le verbe.' },
            { type: 'minMots', n: 4, message: 'Ajoute un petit complément pour faire une vraie phrase.' },
            { type: 'majuscule', message: 'Une phrase commence par une majuscule.' },
            { type: 'point', message: 'N’oublie pas le point à la fin de ta phrase.' },
          ],
          bravo: 'Quelle belle phrase, Thao ! Groupe sujet + groupe verbal : c’est exactement ça.',
          solution: `${s.sujet} ${s.verbe} ${s.aide}.`,
        },
        indice: `Écris d’abord « ${s.sujet} », puis « ${s.verbe} », puis ajoute ce que tu veux.`,
        explication: `Une phrase complète = un groupe sujet + un groupe verbal, une majuscule au début et un point à la fin.`,
      }),
    );
  });

  return ex;
}

return { construireM4 };
});

__def("data/bank/m5.js", function (__exports) {
/**
 * MODULE 5 — Trouver le verbe et son infinitif.
 */

const { PHRASES } = __charger("data/corpus/phrases.js");
const { NOMS_COMMUNS } = __charger("data/corpus/noms.js");
const { ADJECTIFS } = __charger("data/corpus/adjectifs.js");
const { exercice, enumerer, melanger, piocher, tokensAffichage } = __charger("data/bank/outils.js");

const M = 'm5';
const C = 'm5';

const GROUPE_INF = (inf) => {
  if (inf.endsWith('er')) return '1er groupe (verbes en -er)';
  if (inf.endsWith('ir')) return '2e ou 3e groupe (verbes en -ir)';
  return '3e groupe';
};

function construireM5() {
  const ex = [];

  /* ---- A. Clique sur le verbe conjugué ----------------------------- */
  melanger(PHRASES, 'm5-verbe')
    .slice(0, 18)
    .forEach((p, i) => {
      const v = p.tokens[p.verbe];
      ex.push(
        exercice({
          id: `m5-clic-verbe-${String(i + 1).padStart(2, '0')}`,
          module: M,
          competence: C,
          format: 'clic-verbe',
          difficulte: p.niveau,
          type: 'clic-mots',
          consigne: 'Clique sur le verbe conjugué de cette phrase.',
          question: { phrase: p.texte, tokens: tokensAffichage(p), source: p.id },
          reponse: {
            indices: [p.verbe],
            bravo: 'Oui ! C’est bien le mot qui dit ce qui se passe.',
          },
          indice:
            'Le verbe dit ce que l’on FAIT. Essaie de changer le temps : « Hier, … » ou « Demain, … ». Le mot qui change, c’est le verbe.',
          explication: `Le verbe est « ${v.w} ». Son infinitif est « ${p.infinitif} ».`,
        }),
      );
    });

  /* ---- B. Écris l'infinitif ---------------------------------------- */
  const pourInf = melanger(PHRASES, 'm5-inf').slice(0, 16);
  pourInf.forEach((p, i) => {
    const v = p.tokens[p.verbe];
    ex.push(
      exercice({
        id: `m5-ecris-infinitif-${String(i + 1).padStart(2, '0')}`,
        module: M,
        competence: C,
        format: 'ecris-infinitif',
        difficulte: p.infinitif.endsWith('er') ? 1 : 3,
        type: 'texte',
        consigne: `Écris l’infinitif du verbe « ${v.w} ».`,
        question: { phrase: p.texte, verbe: v.w, court: true, exemple: 'il court → courir' },
        reponse: {
          attendus: [p.infinitif],
          bravo: 'Exact ! Tu as trouvé son vrai nom.',
          rate: 'Essaie de dire : « il est en train de… ». Ce que tu dis après, c’est l’infinitif.',
        },
        indice:
          'Pour trouver l’infinitif, dis : « il faut … » ou « je vais … ». Exemple : il mange → il faut MANGER.',
        explication: `« ${v.w} » vient du verbe « ${p.infinitif} » — ${GROUPE_INF(p.infinitif)}.`,
      }),
    );
  });

  /* ---- C. Relie le verbe conjugué à son infinitif ------------------ */
  const pool = melanger(
    PHRASES.filter((p, i, arr) => arr.findIndex((q) => q.infinitif === p.infinitif) === i),
    'm5-relie-pool',
  );
  for (let i = 0; i < 8; i++) {
    const lot = pool.slice(i * 4, i * 4 + 4);
    const gauche = lot.map((p, k) => ({ id: `c${k}`, texte: `${p.personne === '3p' ? 'ils' : p.personne === 'nous' ? 'nous' : p.personne === 'tu' ? 'tu' : 'il'} ${p.tokens[p.verbe].w}` }));
    const droite = melanger(lot.map((p, k) => ({ id: `i${k}`, texte: p.infinitif })), `m5-relie-${i}`);
    const paires = {};
    lot.forEach((_, k) => { paires[`c${k}`] = `i${k}`; });
    ex.push(
      exercice({
        id: `m5-relie-${String(i + 1).padStart(2, '0')}`,
        module: M,
        competence: C,
        format: 'relie-inf',
        difficulte: i < 3 ? 1 : 2,
        type: 'paires',
        consigne: 'Relie chaque verbe conjugué à son infinitif.',
        question: { gauche, droite, titreGauche: 'Verbes conjugués', titreDroite: 'Infinitifs' },
        reponse: { paires, bravo: 'Tous les verbes ont retrouvé leur vrai nom !' },
        indice: 'Dis « il faut … » devant chaque infinitif pour vérifier.',
        explication: lot.map((p) => `• ${p.tokens[p.verbe].w} → ${p.infinitif}`).join('\n'),
      }),
    );
  }

  /* ---- D. Plusieurs verbes dans un texte --------------------------- */
  const pourTexte = melanger(PHRASES, 'm5-texte');
  for (let i = 0; i < 6; i++) {
    const a = pourTexte[i * 2];
    const b = pourTexte[i * 2 + 1];
    const tokens = [...tokensAffichage(a), ...tokensAffichage(b).map((t, j) => (j === 0 ? { ...t, glue: false } : t))];
    const indices = [a.verbe, b.verbe + a.tokens.length];
    ex.push(
      exercice({
        id: `m5-verbes-texte-${String(i + 1).padStart(2, '0')}`,
        module: M,
        competence: C,
        format: 'verbes-texte',
        difficulte: 3,
        type: 'clic-mots',
        consigne: 'Ce texte contient DEUX verbes conjugués. Clique sur les deux.',
        question: { phrase: `${a.texte} ${b.texte}`, tokens, source: `${a.id}+${b.id}` },
        reponse: { indices, bravo: 'Les deux verbes sont trouvés !' },
        indice: 'Il y a une phrase, puis une autre. Chaque phrase a son propre verbe.',
        explication: `Les verbes sont « ${a.tokens[a.verbe].w} » (${a.infinitif}) et « ${b.tokens[b.verbe].w} » (${b.infinitif}).`,
      }),
    );
  }

  /* ---- E. Quel verbe manque ? -------------------------------------- */
  const parPersonne = {};
  for (const p of PHRASES) {
    parPersonne[p.personne] = parPersonne[p.personne] || [];
    parPersonne[p.personne].push(p);
  }
  const pourManquant = melanger(parPersonne['3s'], 'm5-manquant').slice(0, 6);
  pourManquant.forEach((p, i) => {
    const autres = melanger(
      parPersonne['3s'].filter((q) => q.infinitif !== p.infinitif),
      `m5-distract-${i}`,
    ).slice(0, 3);
    const options = melanger(
      [p.tokens[p.verbe].w, ...autres.map((q) => q.tokens[q.verbe].w)],
      `m5-opt-${i}`,
    );
    const trou = p.tokens
      .map((t, j) => (j === 0 || t.glue ? '' : ' ') + (j === p.verbe ? '______' : t.w) + t.after)
      .join('')
      .trim();
    ex.push(
      exercice({
        id: `m5-verbe-manquant-${String(i + 1).padStart(2, '0')}`,
        module: M,
        competence: C,
        format: 'verbe-manquant',
        difficulte: 2,
        type: 'choix',
        consigne: 'Choisis le verbe qui convient dans cette phrase.',
        question: { texteTrous: trou, options, source: p.id },
        reponse: {
          index: options.indexOf(p.tokens[p.verbe].w),
          bravo: 'Oui, c’est le verbe qui a du sens ici !',
          rate: 'Relis la phrase en entier avec le verbe que tu as choisi : est-ce que ça veut dire quelque chose ?',
        },
        indice: 'Les quatre verbes sont bien conjugués. Un seul raconte quelque chose de possible.',
        explication: `La phrase complète est : « ${p.texte} ».`,
      }),
    );
  });

  /* ---- F. L'intrus : lequel n'est pas un verbe ? ------------------- */
  const infinitifs = [...new Set(PHRASES.map((p) => p.infinitif))];
  const nonVerbes = [
    ...NOMS_COMMUNS.map((n) => ({ mot: n.mot, nature: 'un nom' })),
    ...ADJECTIFS.map((a) => ({ mot: a.ms, nature: 'un adjectif' })),
  ];
  for (let i = 0; i < 6; i++) {
    const verbes = piocher(infinitifs, 3, `m5-intrus-v-${i}`);
    const intrus = piocher(nonVerbes, 1, `m5-intrus-n-${i}`)[0];
    const options = melanger([...verbes, intrus.mot], `m5-intrus-mix-${i}`);
    ex.push(
      exercice({
        id: `m5-intrus-${String(i + 1).padStart(2, '0')}`,
        module: M,
        competence: C,
        format: 'intrus-verbe',
        difficulte: 1,
        type: 'choix',
        consigne: 'Trouve l’intrus : lequel de ces mots n’est PAS un verbe ?',
        question: { options },
        reponse: {
          index: options.indexOf(intrus.mot),
          bravo: 'Bien repéré !',

  courir: 'cour',
  ouvrir: 'ouvr',
  couvrir: 'couvr',
  recouvrir: 'recouvr',
  offrir: 'offr',
  souffrir: 'souffr',
  cueillir: 'cueill',
  partir: 'part',
  sortir: 'sort',
  dormir: 'dorm',
  servir: 'serv',
  sentir: 'sent',
  mentir: 'ment',
  mourir: 'mour',
};

/** Verbes en -ir qui prennent le radical long en -iss- (type "finir"). */
const IR_ISSANT = new Set([
  'finir', 'grandir', 'ralentir', 'réussir', 'remplir', 'choisir', 'bâtir',
  'rougir', 'pâlir', 'atterrir', 'applaudir', 'nourrir', 'salir', 'démolir',
  'guérir', 'obéir', 'punir', 'réfléchir', 'bondir', 'avertir', 'fleurir',
  'adoucir', 'élargir', 'alourdir', 'refroidir', 'éclaircir',
]);

const VOYELLES = 'aeiouyàâäéèêëîïôöûü';

/** "je" devient "j’" devant une voyelle ou un h muet. */
function elide(sujet, forme) {
  if (sujet !== 'je') return `${sujet} ${forme}`;
  const c = forme[0].toLowerCase();
  if (VOYELLES.includes(c) || c === 'h') return `j’${forme}`;
  return `je ${forme}`;
}

/** Calcule le radical d'imparfait d'un infinitif. */
function radicalImparfait(infinitif) {
  const inf = infinitif.normalize('NFC');
  if (RADICAUX_IRREGULIERS[inf]) return RADICAUX_IRREGULIERS[inf];
  if (inf.endsWith('er')) return inf.slice(0, -2);
  if (inf.endsWith('ir')) {
    const base = inf.slice(0, -2);
    if (IR_ISSANT.has(inf)) return `${base}iss`;
    return base;
  }
  if (inf.endsWith('re')) return inf.slice(0, -2);
  throw new Error(`Radical d'imparfait inconnu pour "${infinitif}"`);
}

/**
 * Conjugue un verbe a l'imparfait.
 * @returns {string} la forme verbale seule, sans pronom.
 */
function imparfait(infinitif, personne) {
  const term = TERMINAISONS[personne];
  if (!term) throw new Error(`Personne inconnue : ${personne}`);
  const inf = infinitif.normalize('NFC');
  let radical = radicalImparfait(inf);

  // Verbes en -ger : le "e" est conserve devant a/o pour garder le son [j].
  if (inf.endsWith('ger') && !RADICAUX_IRREGULIERS[inf] && term.startsWith('a')) {
    radical += 'e';
  }
  // Verbes en -cer : le "c" devient "c cedille" devant a/o.
  if (inf.endsWith('cer') && !RADICAUX_IRREGULIERS[inf] && term.startsWith('a')) {
    radical = `${radical.slice(0, -1)}ç`;
  }
  return radical + term;
}

/** Conjugue avec le pronom : "je jouais", "j’étais", "nous jouions". */
function imparfaitAvecSujet(infinitif, personne) {
  const p = PERSONNES.find((x) => x.id === personne);
  return elide(p.sujet, imparfait(infinitif, personne));
}

/** Le tableau complet des six personnes. */
function tableauImparfait(infinitif) {
  return PERSONNES.map((p) => ({
    personne: p.id,
    libelle: p.libelle,
    sujet: p.sujet,
    forme: imparfait(infinitif, p.id),
    complet: imparfaitAvecSujet(infinitif, p.id),
  }));
}

/* ------------------------------------------------------------------ */
/* Présent : seulement les deux personnes utiles aux transformations   */
/* ------------------------------------------------------------------ */

/**
 * « nous » au présent. Le radical de l'imparfait EST celui du présent à la
 * 1re personne du pluriel : « nous chant-ons » → « je chant-ais ». La règle
 * se retourne donc, avec une seule exception en français : le verbe être.
 */
const PRESENT_NOUS_EXCEPTIONS = { 'être': 'sommes' };
const PRESENT_VOUS_EXCEPTIONS = { 'être': 'êtes', faire: 'faites', dire: 'dites' };

function presentNous(infinitif) {
  const inf = infinitif.normalize('NFC');
  if (PRESENT_NOUS_EXCEPTIONS[inf]) return PRESENT_NOUS_EXCEPTIONS[inf];
  let radical = radicalImparfait(inf);
  // « nous mangeons », « nous commençons » : le son est conservé devant -ons.
  if (inf.endsWith('ger') && !RADICAUX_IRREGULIERS[inf]) radical += 'e';
  if (inf.endsWith('cer') && !RADICAUX_IRREGULIERS[inf]) radical = `${radical.slice(0, -1)}ç`;
  return `${radical}ons`;
}

function presentVous(infinitif) {
  const inf = infinitif.normalize('NFC');
  if (PRESENT_VOUS_EXCEPTIONS[inf]) return PRESENT_VOUS_EXCEPTIONS[inf];
  return `${radicalImparfait(inf)}ez`;
}

return { PERSONNES, RADICAUX_IRREGULIERS, elide, radicalImparfait, imparfait, imparfaitAvecSujet, tableauImparfait, presentNous, presentVous };
});

__def("data/bank/m7.js", function (__exports) {
/**
 * MODULE 7 — Les familles de mots.
 *
 * Les pièges sont volontaires et vérifiés : « chantier » n'est PAS de la
 * famille de « chanter », « jouer » n'est PAS de la famille de « jour ».
 * Avant de fabriquer un exercice qui mélange deux familles, on vérifie
 * qu'aucun mot n'appartient aux deux : sinon l'exercice aurait deux réponses.
 */

const { FAMILLES } = __charger("data/corpus/familles.js");
const { exercice, enumerer, melanger, piocher } = __charger("data/bank/outils.js");

const M = 'm7';
const C = 'm7';

/** Deux familles sont compatibles si aucun mot (ni intrus) n'est partagé. */
function compatibles(a, b) {
  const motsA = new Set([...a.mots, ...a.intrus]);
  return ![...b.mots, ...b.intrus].some((m) => motsA.has(m));
}

/** Construit des paires de familles sans aucun mot en commun. */
function pairesDeFamilles(n) {
  const out = [];
  const ordre = melanger(FAMILLES, 'm7-paires');
  const pris = new Set();
  for (const a of ordre) {
    if (out.length >= n) break;
    if (pris.has(a.id)) continue;
    const b = ordre.find((x) => x.id !== a.id && !pris.has(x.id) && compatibles(a, x));
    if (!b) continue;
    pris.add(a.id);
    pris.add(b.id);
    out.push([a, b]);
  }
  return out;
}

function construireM7() {
  const ex = [];

  /* ---- A. Trouve l'intrus ------------------------------------------ */
  melanger(FAMILLES.filter((f) => f.mots.length >= 3), 'm7-intrus')
    .slice(0, 14)
    .forEach((f, i) => {
      const trois = piocher(f.mots, 3, `m7-i-${f.id}`);
      const intrus = f.intrus[i % f.intrus.length];
      const options = melanger([...trois, intrus], `m7-imix-${f.id}`);
      ex.push(
        exercice({
          id: `m7-intrus-${String(i + 1).padStart(2, '0')}`,
          module: M,
          competence: C,
          format: 'intrus',
          difficulte: i < 6 ? 1 : 2,
          type: 'choix',
          consigne: 'Trois mots sont de la même famille. Clique sur l’intrus.',
          question: { options },
          reponse: {
            index: options.indexOf(intrus),
            bravo: 'Bien joué, l’intrus est démasqué !',
            rate: `Attention au piège : ce mot est bien de la famille de « ${f.radical} ».`,
          },
          indice: `Cherche le morceau commun et surtout l’IDÉE commune : ici, ${f.sens}.`,
          explication: `${enumerer(trois)} sont de la famille de « ${f.radical} » (${f.sens}). « ${intrus} » ressemble un peu, mais n’a rien à voir avec cette idée.`,
        }),
      );
    });

  /* ---- B. Regroupe les deux familles ------------------------------- */
  pairesDeFamilles(12).forEach(([a, b], i) => {
    const motsA = piocher(a.mots, 3, `m7-ra-${a.id}`);
    const motsB = piocher(b.mots, 3, `m7-rb-${b.id}`);
    const placement = {};
    motsA.forEach((m) => { placement[m] = a.id; });
    motsB.forEach((m) => { placement[m] = b.id; });
    ex.push(
      exercice({
        id: `m7-regroupe-${String(i + 1).padStart(2, '0')}`,
        module: M,
        competence: C,
        format: 'regroupe',
        difficulte: i < 6 ? 1 : i < 10 ? 2 : 3,
        type: 'colonnes',
        consigne: 'Range chaque mot dans sa famille.',
        question: {
          mots: melanger([...motsA, ...motsB], `m7-rmix-${i}`),
          colonnes: [
            { id: a.id, titre: `Famille de « ${a.radical} »`, aide: a.sens },
            { id: b.id, titre: `Famille de « ${b.radical} »`, aide: b.sens },
          ],
        },
        reponse: { placement, bravo: 'Les deux familles sont bien rangées !' },
        indice: 'Regarde le morceau de mot qui revient dans chaque famille.',
        explication: `Famille de « ${a.radical} » : ${enumerer(motsA)}. Famille de « ${b.radical} » : ${enumerer(motsB)}.`,
      }),
    );
  });

  /* ---- C. Complète la famille -------------------------------------- */
  melanger(FAMILLES, 'm7-complete')
    .slice(0, 12)
    .forEach((f, i) => {
      const montres = piocher(f.mots, 2, `m7-cm-${f.id}`);
      const bon = f.mots.find((m) => !montres.includes(m));
      const autres = melanger(
        FAMILLES.filter((x) => x.id !== f.id && compatibles(f, x)).flatMap((x) => x.mots),
        `m7-cd-${f.id}`,
      ).slice(0, 2);
      const options = melanger([bon, f.intrus[0], ...autres], `m7-cmix-${f.id}`);
      ex.push(
        exercice({
          id: `m7-complete-${String(i + 1).padStart(2, '0')}`,
          module: M,
          competence: C,
          format: 'complete-famille',
          difficulte: i < 5 ? 1 : 2,
          type: 'choix',
          consigne: `Quel mot appartient à la même famille que ${enumerer(montres.map((m) => `« ${m} »`))} ?`,
          question: { options, montres },
          reponse: {
            index: options.indexOf(bon),
            bravo: 'Oui ! Même radical, même idée.',
            rate: `Ce mot n’a pas le même radical que « ${f.radical} ».`,
          },
          indice: `Les mots de cette famille tournent autour de cette idée : ${f.sens}.`,
          explication: `« ${bon} » est de la famille de « ${f.radical} », comme ${enumerer(montres)}. Attention, « ${f.intrus[0]} » est un faux ami !`,
        }),
      );
    });

  /* ---- D. Écris un mot de la famille ------------------------------- */
  melanger(FAMILLES.filter((f) => f.mots.length >= 4), 'm7-ecris')
    .slice(0, 10)
    .forEach((f, i) => {
      const montres = piocher(f.mots, 2, `m7-em-${f.id}`);
      const attendus = f.mots.filter((m) => !montres.includes(m));
      ex.push(
        exercice({
          id: `m7-ecris-${String(i + 1).padStart(2, '0')}`,
          module: M,
          competence: C,
          format: 'ecris-famille',
          difficulte: i < 2 ? 2 : 3,
          type: 'texte',
          consigne: `Écris un AUTRE mot de la famille de ${enumerer(montres.map((m) => `« ${m} »`))}.`,
          question: { montres, court: true, exemple: `Un mot différent de ${enumerer(montres)}.` },
          reponse: {
            attendus,
            bravo: 'Super ! Ce mot fait bien partie de la famille.',
            rate: `Ce mot ne fait pas partie de la famille de « ${f.radical} ». Essaie encore !`,
          },
          indice: `Le radical de la famille est « ${f.radical} ». Tu peux ajouter un morceau devant ou derrière.`,
          explication: `Mots de cette famille : ${enumerer(f.mots)}.`,
        }),
      );
    });

  /* ---- E. Quel est le lien de sens ? ------------------------------- */
  melanger(FAMILLES, 'm7-sens')
    .slice(0, 8)
    .forEach((f, i) => {
      const deux = piocher(f.mots, 2, `m7-s-${f.id}`);
      const faux = melanger(FAMILLES.filter((x) => x.id !== f.id), `m7-sf-${f.id}`)
        .slice(0, 2)
        .map((x) => x.sens);
      const options = melanger([f.sens, ...faux], `m7-smix-${f.id}`);
      ex.push(
        exercice({
          id: `m7-lien-${String(i + 1).padStart(2, '0')}`,
          module: M,
          competence: C,
          format: 'lien-sens',
          difficulte: i < 3 ? 1 : 2,
          type: 'choix',
          consigne: `Quel est le lien de sens entre « ${deux[0]} » et « ${deux[1]} » ?`,
          question: { options, mots: deux },
          reponse: {
            index: options.indexOf(f.sens),
            bravo: 'Exactement ! C’est bien l’idée commune de la famille.',
            rate: 'Relis les deux mots et demande-toi de quoi ils parlent tous les deux.',
          },
          indice: 'Les mots d’une famille partagent un morceau ET une idée. Cherche l’idée.',
          explication: `« ${deux[0]} » et « ${deux[1]} » sont de la famille de « ${f.radical} » : ${f.sens}.`,
        }),
      );
    });

  return ex;
}

return { construireM7 };
});

__def("src/core/alphabet.js", function (__exports) {
/**
 * Ordre alphabetique francais, tel qu'on l'apprend au CE2 et tel qu'il est
 * utilise dans un dictionnaire :
 *   - on ne tient pas compte des majuscules ;
 *   - on ne tient pas compte des accents (e, e accent aigu, e accent grave
 *     se rangent au meme endroit) ;
 *   - les traits d'union et les apostrophes sont ignores ;
 *   - quand deux mots commencent pareil, on compare la lettre suivante ;
 *   - un mot plus court passe avant le mot plus long qui commence pareil
 *     ("mer" avant "merci").
 */

/** Cle de comparaison : minuscules, sans accent, lettres seulement. */
function cleAlpha(mot) {
  return String(mot)
    .toLowerCase()
    .replace(/œ/g, 'oe')
    .replace(/æ/g, 'ae')
    .normalize('NFD')
    .replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z]/g, '');
}

/** Compare deux mots. < 0 si a vient avant b, > 0 sinon, 0 si meme rang. */
function compareAlpha(a, b) {
  const ka = cleAlpha(a);
  const kb = cleAlpha(b);
  if (ka < kb) return -1;
  if (ka > kb) return 1;
  return 0;
}

/** Trie une liste de mots dans l'ordre alphabetique (copie). */
function trierAlpha(mots) {
  return [...mots].sort((a, b) => compareAlpha(a, b) || (a < b ? -1 : a > b ? 1 : 0));
}

/** La liste est-elle rangee dans l'ordre alphabetique ? */
function estTrieAlpha(mots) {
  for (let i = 1; i < mots.length; i++) {
    if (compareAlpha(mots[i - 1], mots[i]) > 0) return false;
  }
  return true;
}

/** Rang de la premiere lettre qui differe (1 = la premiere lettre). */
function premiereDifference(a, b) {
  const ka = cleAlpha(a);
  const kb = cleAlpha(b);
  const n = Math.min(ka.length, kb.length);
  for (let i = 0; i < n; i++) {
    if (ka[i] !== kb[i]) return i + 1;
  }
  return n + 1; // l'un est le debut de l'autre
}

/**
 * Le mot se trouve-t-il entre les deux mots reperes d'une page de
 * dictionnaire ? Les mots reperes eux-memes sont sur la page (bornes incluses).
 */
function estEntre(mot, repereGauche, repereDroit) {
  return (
    compareAlpha(mot, repereGauche) >= 0 && compareAlpha(mot, repereDroit) <= 0
  );
}

return { cleAlpha, compareAlpha, trierAlpha, estTrieAlpha, premiereDifference, estEntre };
});

  /* ---- E. Le coffre à trois serrures ------------------------------- */
  for (let i = 0; i < 6; i++) {
    const trois = piocher(MOTS_DICO, 3, `m9-coffre-${i}`);
    const champs = trois.map((mot, k) => ({
      cle: `c${k}`,
      etiquette: mot,

      exercice({
        id: `m9-coffre-${String(i + 1).padStart(2, '0')}`,
        module: M,
        competence: C,
        format: 'coffre',
        difficulte: 3,
        type: 'textes',
        consigne: 'Trois serrures, trois mots à chercher. Écris le numéro de la page de chaque mot pour ouvrir le coffre !',
        question: {
          coffre: true,
          pages: PAGES.map((p) => ({ numero: p.numero, repereGauche: p.repereGauche, repereDroit: p.repereDroit })),
          champs: champs.map((c) => ({ cle: c.cle, etiquette: c.etiquette })),

        indice: 'Pour chaque mot, cherche la page dont les deux mots repères l’encadrent.',

          court: true,

            `Il est sur la page dont les mots repères sont « ${page.repereGauche} » et « ${page.repereDroit} ».`,

        },
        indice: `Le mot commence par « ${mot.slice(0, 2)} ».`,
        explication: `Le mot mystère était « ${mot} » : ${DEFINITIONS[mot].def}`,
      }),
    );
  });

  return ex;
}

const DEFINITIONS = Object.fromEntries(
  ENTREES.map(([mot, nature, def]) => [mot, { mot, nature, def }]),
);

/** Découpe le dictionnaire en pages de `parPage` mots. */
function pagesDico(parPage = 6) {
  const pages = [];
  for (let i = 0; i < MOTS_DICO.length; i += parPage) {
    const mots = MOTS_DICO.slice(i, i + parPage);
    if (mots.length < 2) {
      // On ne laisse jamais une page orpheline : on la fusionne avec la précédente.
      if (pages.length) {
        pages[pages.length - 1].mots.push(...mots);
        const p = pages[pages.length - 1];
        p.repereDroit = p.mots[p.mots.length - 1];
      }
      continue;
    }
    pages.push({
      numero: pages.length + 1,
      mots,
      repereGauche: mots[0],
      repereDroit: mots[mots.length - 1],

function pageDuMot(mot, pages = pagesDico()) {
  return (
    pages.find(
      (p) =>
        compareAlpha(mot, p.repereGauche) >= 0 &&
        compareAlpha(mot, p.repereDroit) <= 0,
    ) || null
  );
}

return { MOTS_DICO, DEFINITIONS, pagesDico, pageDuMot };

__def("src/core/seance.js", function (__exports) {
/**
 * Les séances : mission du jour (mode vacances), entraînement libre d'un
 * module, exploration d'un monde, et petite évaluation de départ.
 *
 * Une séance de vacances dure 10 à 20 minutes : environ 13 exercices, mélangés
 * entre toutes les compétences, et adaptés à ce que Thao doit retravailler.
 */

const { MODULES, MODULE_PAR_ID, MONDE_PAR_ID } = __charger("data/modules.js");
const { PAR_MODULE } = __charger("data/bank/index.js");
const { choisirExercices, revisionsDues } = __charger("src/core/progression.js");

/** La recette d'une mission du jour : combien d'exercices par domaine. */
const RECETTE = [
  { domaine: 'Noms et déterminants', modules: ['m1', 'm2', 'm3'], n: 3 },
  { domaine: 'Phrases et verbes', modules: ['m4', 'm5'], n: 3 },
  { domaine: 'Conjugaison à l’imparfait', modules: ['m6'], n: 3 },
  { domaine: 'Familles de mots', modules: ['m7'], n: 2 },
  { domaine: 'Dictionnaire', modules: ['m8', 'm9'], n: 2 },
];

const dateJour = () => new Date().toISOString().slice(0, 10);

/** Modules accessibles (monde débloqué). */
function modulesAccessibles(profil) {
  return MODULES.filter((m) => profil.mondes[m.monde]?.debloque).map((m) => m.id);
}

/** Crée la mission du jour. */
function creerSeanceVacances(profil) {
  const accessibles = new Set(modulesAccessibles(profil));
  const ids = [];
  const dejaPris = [];

  for (const bloc of RECETTE) {
    const dispo = bloc.modules.filter((m) => accessibles.has(m));
    if (!dispo.length) continue;
    // On commence par le module le plus fragile du bloc.
    const classe = [...dispo].sort((a, b) => {
      const sa = profil.competences[a];
      const sb = profil.competences[b];
      const poids = (s) => (s.etat === 'fragile' ? 0 : s.etat === 'nouvelle' ? 1 : s.etat === 'en-cours' ? 2 : 3);
      return poids(sa) - poids(sb) || sa.maitrise - sb.maitrise;
    });
    let reste = bloc.n;
    for (let i = 0; i < classe.length && reste > 0; i++) {
      const part = i === classe.length - 1 ? reste : Math.ceil(bloc.n / classe.length);
      const lot = choisirExercices(profil, {
        module: classe[i],
        n: Math.min(part, reste),
        eviter: dejaPris,
        maxParFormat: 1,
      });
      lot.forEach((e) => {
        ids.push(e.id);
        dejaPris.push(e.id);
      });
      reste -= lot.length;
    }
  }

  return {
    type: 'vacances',
    titre: 'Ma mission du jour',
    sousTitre: `${ids.length} exercices, environ ${Math.max(10, Math.round(ids.length * 1.2))} minutes`,
    jour: dateJour(),
    ids,
    index: 0,
    reponses: {},
    debut: new Date().toISOString(),
    secondes: 0,
    fini: false,
  };
}

/** Séance d'entraînement sur un module précis. */
function creerSeanceModule(profil, moduleId, n = 8) {
  const mod = MODULE_PAR_ID[moduleId];
  const lot = choisirExercices(profil, { module: moduleId, n });
  return {
    type: 'module',
    module: moduleId,
    titre: mod ? mod.titre : moduleId,
    sousTitre: `${lot.length} exercices choisis pour toi`,
    jour: dateJour(),
    ids: lot.map((e) => e.id),
    index: 0,
    reponses: {},
    debut: new Date().toISOString(),
    secondes: 0,
    fini: false,
  };
}

/** Séance d'exploration d'un monde. */
function creerSeanceMonde(profil, mondeId, n = 10) {
  const monde = MONDE_PAR_ID[mondeId];
  const lot = choisirExercices(profil, { monde: mondeId, n });
  return {
    type: 'monde',
    monde: mondeId,
    titre: monde ? monde.titre : mondeId,
    sousTitre: `${lot.length} épreuves à relever`,
    jour: dateJour(),
    ids: lot.map((e) => e.id),
    index: 0,
    reponses: {},
    debut: new Date().toISOString(),
    secondes: 0,
    fini: false,
  };
}

/** Séance ciblée sur une liste de formats (exercices libres). */
function creerSeanceFormats(profil, moduleId, formats, n = 8) {
  const lot = choisirExercices(profil, { module: moduleId, formats, n, maxParFormat: n });
  const mod = MODULE_PAR_ID[moduleId];
  return {
    type: 'libre',
    module: moduleId,
    titre: mod ? mod.titre : moduleId,
    sousTitre: 'Entraînement choisi par toi',
    jour: dateJour(),
    ids: lot.map((e) => e.id),
    index: 0,
    reponses: {},
    debut: new Date().toISOString(),
    secondes: 0,
    fini: false,
  };
}

/**
 * Petite évaluation de départ : une question facile par compétence.
 * Aucune note n'est affichée — elle sert seulement à régler la difficulté.
 */
function creerEvaluation(profil) {
  const ids = [];
  for (const m of MODULES) {
    const faciles = (PAR_MODULE[m.id] || []).filter((e) => e.difficulte === 1);
    const pool = faciles.length ? faciles : PAR_MODULE[m.id] || [];
    const choisi = pool[Math.floor(pool.length / 2)];
    if (choisi) ids.push(choisi.id);
  }
  return {
    type: 'evaluation',
    titre: 'On fait connaissance !',
    sousTitre: '9 petites questions, sans note. Juste pour savoir par où commencer.',
    jour: dateJour(),
    ids,
    index: 0,
    reponses: {},
    debut: new Date().toISOString(),
    secondes: 0,
    fini: false,
  };
}

/** Règle la difficulté de départ d'après l'évaluation. */
function appliquerEvaluation(profil, seance) {
  profil.evaluation = { fait: true, resultats: {} };
  for (const [exId, rep] of Object.entries(seance.reponses)) {
    const mod = exId.split('-')[0];
    if (!profil.competences[mod]) continue;
    profil.evaluation.resultats[mod] = rep.statut;
    profil.competences[mod].niveauDifficulte = rep.statut === 'juste' ? 2 : 1;
  }
  return profil;
}

/* ------------------------------------------------------------------ */
/* Déroulement                                                         */
/* ------------------------------------------------------------------ */

function progressionSeance(seance) {
  const total = seance.ids.length || 1;
  const faits = Object.keys(seance.reponses).length;
  return {
    total,
    faits,
    restants: Math.max(0, total - faits),
    pourcentage: Math.round((100 * faits) / total),
  };
}

function idCourant(seance) {
  if (!seance || seance.fini) return null;
  return seance.ids[seance.index] || null;
}

/** Note la réponse dans la séance et avance. */
function noterEtAvancer(seance, exId, statut, essais, secondes) {
  seance.reponses[exId] = { statut, essais, secondes };
  seance.secondes = (seance.secondes || 0) + (secondes || 0);
  seance.index += 1;
  if (seance.index >= seance.ids.length) seance.fini = true;
  return seance;
}

/** Bilan de fin de séance. */
function bilanSeance(seance) {
  const reps = Object.values(seance.reponses);
  const justes = reps.filter((r) => r.statut === 'juste').length;
  const presque = reps.filter((r) => r.statut === 'presque').length;
  const competences = [...new Set(seance.ids.map((id) => id.split('-')[0]))];
  return {
    total: seance.ids.length,
    repondus: reps.length,
    justes,
    presque,
    faux: reps.length - justes - presque,
    reussite: reps.length ? Math.round((100 * justes) / reps.length) : 0,
    minutes: Math.max(1, Math.round((seance.secondes || 0) / 60)),
    competences: competences.map((id) => MODULE_PAR_ID[id]).filter(Boolean),
  };
}

/** Enregistre la séance terminée dans le journal des missions. */
function archiverSeance(profil, seance) {
  const bilan = bilanSeance(seance);
  profil.missions.terminees += 1;
  profil.missions.journal.push({
    date: new Date().toISOString(),
    jour: seance.jour,
    type: seance.type,
    titre: seance.titre,
    total: bilan.total,
    justes: bilan.justes,
    minutes: bilan.minutes,
    competences: bilan.competences.map((c) => c.id),
  });
  if (profil.missions.journal.length > 120) {
    profil.missions.journal = profil.missions.journal.slice(-120);
  }
  // Une mission terminée ouvre un coffre une fois sur deux.
  if (profil.missions.terminees % 2 === 0) profil.coffresEnAttente += 1;
  profil.seance = null;
  return bilan;
}

/** Nombre d'exercices de révision qui attendent. */
function revisionsEnAttente(profil) {
  return revisionsDues(profil).length;
}

return { RECETTE, modulesAccessibles, creerSeanceVacances, creerSeanceModule, creerSeanceMonde, creerSeanceFormats, creerEvaluation, appliquerEvaluation, progressionSeance, idCourant, noterEtAvancer, bilanSeance, archiverSeance, revisionsEnAttente };
});

__def("src/ui/interactions.js", function (__exports) {
/**
 * Les onze façons de répondre.
 *
 * Chaque interaction est une petite fabrique qui renvoie :
 *   el()            l'élément à afficher
 *   saisie()        la réponse de Thao, au format attendu par la correction
 *   pret()          y a-t-il de quoi valider ?
 *   marquer(res)    colorie la réponse après correction (jamais la couleur
 *                   seule : il y a toujours une icône ✓ ✕ ! et un mot)
 *   verrouiller()   empêche de modifier après validation
 *   reinitialiser() pour un nouvel essai
 *
 * Tout fonctionne au doigt, à la souris ET au clavier.
 */

const { h, svg, vider } = __charger("src/ui/dom.js");
const { icone } = __charger("src/ui/art.js");
const { son, vibrer } = __charger("src/ui/fx.js");

const LETTRES = ['A', 'B', 'C', 'D', 'E', 'F'];

/* ------------------------------------------------------------------ */
/* Décorations partagées : page de dictionnaire, phrase de départ…     */
/* ------------------------------------------------------------------ */

function pageDico(page, titre = 'Page du dictionnaire') {
  return h('div.dico', null,
    h('div.dico__haut', null,
      h('span', null, page.repereGauche),
      h('span.dico__num', null, page.numero ? `page ${page.numero}` : titre),
      h('span', null, page.repereDroit)),
    page.entrees
      ? h('dl.dico__entrees', null, ...page.entrees.map((e) => h('div.dico__entree', null,
          h('dt.dico__mot', null, e.mot, e.nature ? h('span', null, e.nature) : null),
          h('dd.dico__def', { style: { margin: 0 } }, e.def))))
      : page.mots
        ? h('div.dico__liste', null, ...page.mots.map((m) => h('span.etiquette', null, m)))
        : null,
  );
}

function decorations(ex) {
  const q = ex.question;
  const blocs = [];
  if (q.pageComplete) blocs.push(pageDico(q.pageComplete));
  if (q.page) blocs.push(pageDico(q.page));
  if (q.definition) blocs.push(h('div.depart', null, '« ', q.definition, ' »'));
  if (q.affirmation) blocs.push(h('p.phrase-travail', null, q.affirmation));
  if (q.phrase && !q.tokens) blocs.push(h('p.phrase-travail', null, q.phrase));
  if (q.depart) blocs.push(h('div.depart', null, q.depart));
  if (q.faux) blocs.push(h('div.depart', { style: { borderLeftColor: 'var(--faux)' } }, q.faux));
  if (q.trou) blocs.push(h('div.depart', null, q.trou));
  if (q.groupe) blocs.push(h('div.depart', null, q.groupe));
  if (q.mot && !q.options) blocs.push(h('div.depart', null, q.mot));
  if (q.texteTrous && !q.champs) blocs.push(h('p.phrase-travail', null, q.texteTrous));
  if (Array.isArray(q.liste)) {
    blocs.push(h('div.reserve', null, ...q.liste.map((m) => h('span.etiquette', null, m))));
  }
  if (q.enListe && Array.isArray(q.mots)) {
    blocs.push(h('div.reserve', null, ...q.mots.map((m) => h('span.etiquette', null, m))));
