<title>Thao Aventure</title>
<meta name="description" content="La grande aventure du français en CE2 : 547 exercices interactifs pour Thao.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Lexend:wght@300;400;500;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* ==========================================================================
   THAO AVENTURE — identité visuelle « atlas étoilé »
   L'aventure se déroule dans un vieil atlas magique, de nuit : fond indigo,
   constellations, or et turquoise. Mais dès qu'un exercice commence, LA PAGE
   S'ALLUME : un parchemin clair, à l'encre sombre, pour une lisibilité
   maximale des phrases que Thao doit déchiffrer.
   ========================================================================== */

:root {
  /* Nuit */
  --nuit-2: #070a22;
  --nuit: #0b1033;
  --encre: #141a45;
  --encre-2: #1c2458;
  --encre-3: #262f6e;

  /* Lumières */
  --turquoise: #2fd6c4;
  --turquoise-clair: #5be5d6;
  --violet: #8b6cf0;
  --violet-clair: #b78bf5;
  --or: #ffc24b;
  --or-clair: #ffe2a3;
  --orange: #ff8a4c;

  /* Textes sur la nuit */
  --texte: #e9ebff;
  --texte-doux: #b3b9ec;
  --texte-faible: #7d83bc;

  /* Page de travail */
  --page: #fff6e6;
  --page-2: #fdecd3;
  --page-bord: #e8d6b4;
  --encre-sombre: #1a1633;
  --encre-moyenne: #4a4470;
  --encre-douce: #6f6a97;

  /* Signaux (toujours accompagnés d'une icône et d'un mot) */
  --juste: #1f9d5c;
  --juste-fond: #e2f8ec;
  --presque: #b96a00;
  --presque-fond: #fff0d6;
  --faux: #c4365c;
  --faux-fond: #ffe7ed;
  --juste-nuit: #4ce39a;
  --presque-nuit: #ffc368;
  --faux-nuit: #ff8da8;

  --trait: rgba(255, 255, 255, 0.11);
  --trait-fort: rgba(255, 255, 255, 0.2);

  --r-s: 10px;
  --r-m: 16px;
  --r-l: 24px;
  --r-xl: 34px;
  --ombre-douce: 0 10px 30px rgba(3, 6, 24, 0.45);
  --ombre-forte: 0 22px 60px rgba(3, 6, 24, 0.6);
  --ombre-page: 0 18px 50px rgba(3, 6, 24, 0.55), 0 2px 0 #fffdf7 inset;

  --police-titre: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  --police: 'Lexend', 'Segoe UI', system-ui, sans-serif;
  --police-lecture: 'Atkinson Hyperlegible', 'Lexend', Georgia, serif;

  --t-base: 17px;
  --barre-h: 64px;
  --nav-h: 72px;
}

/* Réglage « grande police » de l'écran Paramètres */
:root[data-police='grande'] { --t-base: 20px; }

/* Réglage « contraste renforcé » */
:root[data-contraste='fort'] {
  --texte: #ffffff;
  --texte-doux: #d7dbff;
  --texte-faible: #a9aee0;
  --encre: #0d1238;
  --trait: rgba(255, 255, 255, 0.28);
  --page: #fffdf6;
  --encre-sombre: #0d0a1c;
  --encre-moyenne: #332d55;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--nuit);
  color: var(--texte);
  font-family: var(--police);
  font-size: var(--t-base);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

h1, h2, h3, h4 {
  font-family: var(--police-titre);
  font-weight: 700;
  line-height: 1.15;
  margin: 0;
  text-wrap: balance;
}

button { font-family: inherit; font-size: inherit; cursor: pointer; }
input, textarea { font-family: inherit; font-size: inherit; }

:focus-visible {
  outline: 3px solid var(--or);
  outline-offset: 3px;
  border-radius: 6px;
}

.pour-lecteur {
  position: absolute;
  width: 1px; height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

/* --------------------------------------------------------------------------
   Ciel étoilé
   -------------------------------------------------------------------------- */

.ciel {
  position: fixed;
  inset: 0;
  z-index: -2;
  background:
    radial-gradient(900px 600px at 15% -5%, rgba(139, 108, 240, 0.33), transparent 65%),
    radial-gradient(760px 520px at 88% 8%, rgba(47, 214, 196, 0.2), transparent 62%),
    radial-gradient(900px 700px at 50% 108%, rgba(255, 138, 76, 0.15), transparent 65%),
    linear-gradient(175deg, var(--nuit) 0%, var(--nuit-2) 100%);
}
.ciel canvas { width: 100%; height: 100%; display: block; }

/* --------------------------------------------------------------------------
   Barre du haut
   -------------------------------------------------------------------------- */

.barre {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px clamp(12px, 3vw, 28px);
  min-height: var(--barre-h);
  background: linear-gradient(180deg, rgba(11, 16, 51, 0.95), rgba(11, 16, 51, 0.72));
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--trait);
}

.barre__id {
  display: flex;
  align-items: center;
  gap: 10px;
  background: none;
  border: 0;
  padding: 4px;
  border-radius: var(--r-m);
  color: inherit;
}
.barre__avatar {
  width: 42px; height: 42px;
  flex: 0 0 auto;
  border-radius: 14px;
  background: linear-gradient(150deg, var(--violet), var(--turquoise));
  display: grid; place-items: center;
  box-shadow: 0 6px 18px rgba(139, 108, 240, 0.45);
}
.barre__nom { font-family: var(--police-titre); font-size: 1.05rem; font-weight: 700; }
.barre__titre { font-size: 0.72rem; color: var(--texte-faible); letter-spacing: 0.04em; }

.barre__jauge { flex: 1 1 140px; min-width: 90px; max-width: 320px; }
.jauge {
  height: 10px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.1);
  overflow: hidden;
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.35);
}
.jauge__plein {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--turquoise), var(--or));
  transition: width 0.7s cubic-bezier(0.22, 1, 0.36, 1);
}
.jauge__texte {
  display: flex; justify-content: space-between;
  font-size: 0.7rem; color: var(--texte-faible);
  margin-top: 3px;
}

.compteurs { display: flex; gap: 8px; margin-left: auto; }
.compteur {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 11px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid var(--trait);
  font-variant-numeric: tabular-nums;
  font-size: 0.9rem;
  font-weight: 500;
}
.compteur--or { color: var(--or-clair); }
.compteur--turquoise { color: var(--turquoise-clair); }

.bouton-icone {
  width: 42px; height: 42px;
  display: grid; place-items: center;
  border-radius: 13px;
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid var(--trait);
  color: var(--texte-doux);
  flex: 0 0 auto;
}
.bouton-icone:hover { background: rgba(255, 255, 255, 0.14); color: var(--texte); }
.bouton-icone[aria-pressed='false'] { color: var(--texte-faible); }

/* --------------------------------------------------------------------------
   Disposition générale
   -------------------------------------------------------------------------- */

.coque { min-height: 100vh; display: flex; flex-direction: column; }

.vue {
  flex: 1;
  width: 100%;
  max-width: 1120px;
  margin: 0 auto;
  padding: clamp(16px, 3vw, 32px) clamp(14px, 3vw, 28px) calc(var(--nav-h) + 28px);
}
.vue--etroite { max-width: 780px; }

.nav {
  position: fixed;
  z-index: 45;
  left: 50%; bottom: 0;
  transform: translateX(-50%);
  width: min(620px, 100%);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 4px;
  padding: 8px max(8px, env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));
  background: linear-gradient(0deg, rgba(7, 10, 34, 0.98), rgba(7, 10, 34, 0.86));
  backdrop-filter: blur(16px);
  border-top: 1px solid var(--trait);
  border-radius: var(--r-l) var(--r-l) 0 0;
}
.nav__item {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 7px 2px;
  border: 0; background: none;
  border-radius: 14px;
  color: var(--texte-faible);
  font-size: 0.67rem;
  font-weight: 500;
  text-decoration: none;
}
.nav__item[aria-current='page'] {
  color: var(--nuit);
  background: linear-gradient(140deg, var(--or), var(--orange));
  box-shadow: 0 6px 16px rgba(255, 194, 75, 0.35);
}
.nav__item:hover:not([aria-current='page']) { color: var(--texte); background: rgba(255, 255, 255, 0.07); }

/* --------------------------------------------------------------------------
   Cartes
   -------------------------------------------------------------------------- */

.carte {
  background: linear-gradient(165deg, var(--encre-2), var(--encre));
  border: 1px solid var(--trait);
  border-radius: var(--r-l);
  padding: clamp(16px, 2.4vw, 24px);
  box-shadow: var(--ombre-douce);
}
.carte--lueur {
  border-color: rgba(255, 194, 75, 0.3);
  box-shadow: var(--ombre-forte), 0 0 0 1px rgba(255, 194, 75, 0.12) inset;
}
.carte--plate { background: rgba(255, 255, 255, 0.045); box-shadow: none; }

.titre-section {
  display: flex; align-items: baseline; gap: 10px;
  margin: 30px 0 14px;
}
.titre-section h2 { font-size: clamp(1.3rem, 3.4vw, 1.75rem); }
.titre-section span { color: var(--texte-faible); font-size: 0.85rem; }

.sur-titre {
  text-transform: uppercase;
  letter-spacing: 0.14em;
  font-size: 0.7rem;
  font-weight: 600;
  color: var(--turquoise-clair);
}

.grille { display: grid; gap: 14px; }
.grille--2 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.grille--3 { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.grille--4 { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }

/* --------------------------------------------------------------------------
   Boutons
   -------------------------------------------------------------------------- */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 54px;
  padding: 14px 24px;
  border: 0;
  border-radius: 18px;
  font-family: var(--police-titre);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--nuit);
  background: linear-gradient(140deg, var(--or-clair), var(--or) 45%, var(--orange));
  box-shadow: 0 10px 26px rgba(255, 150, 60, 0.35), 0 2px 0 rgba(255, 255, 255, 0.5) inset;
  transition: transform 0.14s ease, box-shadow 0.2s ease, filter 0.2s ease;
  text-decoration: none;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 16px 34px rgba(255, 150, 60, 0.45); }
.btn:active { transform: translateY(1px) scale(0.99); }
.btn:disabled { filter: grayscale(0.6) brightness(0.8); cursor: not-allowed; transform: none; box-shadow: none; }

.btn--2 {
  background: rgba(255, 255, 255, 0.08);
  color: var(--texte);
  border: 1px solid var(--trait-fort);
  box-shadow: none;
}
.btn--2:hover { background: rgba(255, 255, 255, 0.15); box-shadow: none; }

.btn--3 {
  background: none; border: 0; box-shadow: none;
  color: var(--texte-doux);
  font-family: var(--police);
  font-weight: 500;
  min-height: 44px;
  padding: 10px 14px;
}
.btn--3:hover { color: var(--texte); background: rgba(255, 255, 255, 0.07); transform: none; }

.btn--turquoise {
  background: linear-gradient(140deg, var(--turquoise-clair), var(--turquoise) 60%, #1aa897);
  box-shadow: 0 10px 26px rgba(47, 214, 196, 0.3), 0 2px 0 rgba(255, 255, 255, 0.4) inset;
}
.btn--violet {
  background: linear-gradient(140deg, var(--violet-clair), var(--violet) 60%, #6a49d6);
  color: #fff;
  box-shadow: 0 10px 26px rgba(139, 108, 240, 0.35);
}
.btn--large { width: 100%; min-height: 62px; font-size: 1.15rem; }
.btn--petit { min-height: 44px; padding: 9px 16px; font-size: 0.95rem; border-radius: 14px; }

/* --------------------------------------------------------------------------
   Accueil
   -------------------------------------------------------------------------- */

.bonjour {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 18px;
  align-items: center;
  position: relative;
  overflow: hidden;
}
.bonjour::after {
  content: '';
  position: absolute;
  inset: auto -40px -70px auto;
  width: 240px; height: 240px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 194, 75, 0.2), transparent 70%);
  pointer-events: none;
}
.bonjour h1 { font-size: clamp(1.6rem, 5.4vw, 2.5rem); }
.bonjour p { color: var(--texte-doux); margin: 8px 0 0; max-width: 46ch; }
.bonjour__guide { width: clamp(96px, 20vw, 148px); flex: 0 0 auto; }

.bulle {
  position: relative;
  margin-top: 14px;
  padding: 13px 16px;
  border-radius: 16px 16px 16px 4px;
  background: rgba(47, 214, 196, 0.12);
  border: 1px solid rgba(47, 214, 196, 0.3);
  color: var(--texte);
  font-size: 0.95rem;
}

.stat {
  display: flex; flex-direction: column; gap: 2px;
  padding: 14px 16px;
  border-radius: var(--r-m);
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--trait);
}
.stat__val {
  font-family: var(--police-titre);
  font-size: 1.7rem;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.stat__lib { font-size: 0.78rem; color: var(--texte-faible); }
.stat--or .stat__val { color: var(--or); }
.stat--turquoise .stat__val { color: var(--turquoise); }
.stat--violet .stat__val { color: var(--violet-clair); }
.stat--orange .stat__val { color: var(--orange); }

/* --------------------------------------------------------------------------
   Carte des mondes
   -------------------------------------------------------------------------- */

.atlas { position: relative; }
/* Seule l'illustration directe s'étire : pas les icônes des boutons. */
.atlas > svg { display: block; width: 100%; height: auto; }

/* Une icône dans un bouton garde toujours sa taille. */
.btn svg, .btn--3 svg, .bouton-icone svg, .nav__item svg, .puce svg,
.compteur svg, .option svg, .fleche svg, .lien-btn svg, .conj-ligne > svg,
.retour svg, .indice svg, .surgit svg, .bascule svg, .comp-ligne svg {
  flex: 0 0 auto;
  width: auto;
  height: auto;
}

.monde-carte {
  position: relative;
  display: flex; flex-direction: column;
  gap: 10px;
  padding: 0;
  overflow: hidden;
  border: 1px solid var(--trait);
  border-radius: var(--r-l);
  background: var(--encre);
  box-shadow: var(--ombre-douce);
  text-align: left;
  color: inherit;
  transition: transform 0.18s ease, box-shadow 0.25s ease;
}
.monde-carte:not(:disabled):hover { transform: translateY(-4px); box-shadow: var(--ombre-forte); }
.monde-carte__image { position: relative; aspect-ratio: 16 / 9; }
.monde-carte__image svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.monde-carte__corps { padding: 0 18px 18px; }
.monde-carte__num {
  position: absolute; top: 12px; left: 14px;
  padding: 4px 11px;
  border-radius: 999px;
  background: rgba(7, 10, 34, 0.72);
  border: 1px solid var(--trait-fort);
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.06em;
}
.monde-carte h3 { font-size: 1.25rem; margin-bottom: 2px; }
.monde-carte p { margin: 4px 0 0; color: var(--texte-doux); font-size: 0.9rem; }
.monde-carte--ferme { opacity: 0.62; cursor: not-allowed; }
.monde-carte--ferme .monde-carte__image { filter: grayscale(0.7) brightness(0.65); }
.cadenas {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  background: rgba(7, 10, 34, 0.45);
}
.puce {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 600;
  border: 1px solid var(--trait-fort);
  background: rgba(255, 255, 255, 0.07);
}
.puce--maitrise { color: var(--juste-nuit); border-color: rgba(76, 227, 154, 0.4); background: rgba(76, 227, 154, 0.12); }
.puce--cours { color: var(--turquoise-clair); border-color: rgba(91, 229, 214, 0.4); background: rgba(91, 229, 214, 0.12); }
.puce--fragile { color: var(--presque-nuit); border-color: rgba(255, 195, 104, 0.4); background: rgba(255, 195, 104, 0.12); }
.puce--neutre { color: var(--texte-faible); }
.puce--termine { color: var(--or); border-color: rgba(255, 194, 75, 0.45); background: rgba(255, 194, 75, 0.14); }

/* --------------------------------------------------------------------------
   LA PAGE : surface de travail claire
   -------------------------------------------------------------------------- */

.page-travail {
  position: relative;
  border-radius: var(--r-xl);
  background:
    repeating-linear-gradient(0deg, rgba(190, 160, 110, 0.055) 0 1px, transparent 1px 7px),
    linear-gradient(170deg, var(--page), var(--page-2));
  border: 1px solid var(--page-bord);
  box-shadow: var(--ombre-page);
  color: var(--encre-sombre);
  padding: clamp(18px, 3.2vw, 32px);
  overflow: hidden;
}
.page-travail::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(120% 80% at 50% -10%, rgba(255, 255, 255, 0.85), transparent 60%);
  pointer-events: none;
}
.page-travail > * { position: relative; }

.consigne {
  font-family: var(--police);
  font-weight: 500;
  font-size: clamp(1rem, 2.4vw, 1.12rem);
  color: var(--encre-moyenne);
  margin: 0 0 18px;
}
.consigne strong { color: var(--encre-sombre); }

.phrase-travail {
  font-family: var(--police-lecture);
  font-size: clamp(1.25rem, 4.2vw, 1.72rem);
  line-height: 1.9;
  letter-spacing: 0.01em;
  color: var(--encre-sombre);
}

.mot {
  display: inline-block;
  font: inherit;
  border: 2px solid transparent;
  background: none;
  color: inherit;
  padding: 3px 7px;
  margin: 2px 0;
  border-radius: 11px;
  position: relative;
  vertical-align: baseline;
  transition: background 0.14s ease, transform 0.12s ease, border-color 0.14s ease;
}
.mot--cliquable:hover { background: rgba(26, 22, 51, 0.08); }
.mot--choisi {
  background: linear-gradient(170deg, #cdf6f0, #a7ebe2);
  border-color: #2aa397;
  box-shadow: 0 3px 0 #2aa397;
  transform: translateY(-1px);
}
.mot--choisi::after {
  content: '✓';
  font-family: var(--police);
  font-size: 0.6em;
  font-weight: 700;
  color: #14716a;
  margin-left: 4px;
  vertical-align: 0.25em;
}
.mot--juste { background: var(--juste-fond); border-color: var(--juste); box-shadow: 0 3px 0 var(--juste); }
.mot--juste::after { content: '✓'; color: var(--juste); font-size: 0.6em; margin-left: 4px; vertical-align: 0.25em; font-family: var(--police); font-weight: 700; }
.mot--faux { background: var(--faux-fond); border-color: var(--faux); box-shadow: 0 3px 0 var(--faux); }
.mot--faux::after { content: '✕'; color: var(--faux); font-size: 0.6em; margin-left: 4px; vertical-align: 0.25em; font-family: var(--police); font-weight: 700; }
.mot--oublie { background: var(--presque-fond); border-color: var(--presque); border-style: dashed; }
.mot--oublie::after { content: '!'; color: var(--presque); font-size: 0.65em; margin-left: 4px; vertical-align: 0.25em; font-family: var(--police); font-weight: 700; }
.mot--fixe { padding: 3px 2px; }

/* Ponctuation collée au mot, pour que la phrase reste naturelle. */
.mot__ponct { margin-left: -3px; }

.coupure {
  display: inline-block;
  width: 24px;
  height: 1.7em;
  vertical-align: middle;
  border: 0;
  background: none;
  position: relative;
  border-radius: 8px;
}
.coupure::before {
  content: '';
  position: absolute;
  left: 50%; top: 10%; bottom: 10%;
  width: 3px;
  transform: translateX(-50%);
  border-radius: 3px;
  background: rgba(26, 22, 51, 0.14);
  transition: background 0.15s ease, width 0.15s ease;
}
.coupure:hover::before { background: var(--violet); width: 5px; }
.coupure--choisie::before { background: var(--violet); width: 6px; box-shadow: 0 0 0 4px rgba(139, 108, 240, 0.18); }
.coupure--juste::before { background: var(--juste); width: 6px; }
.coupure--faux::before { background: var(--faux); width: 6px; }

/* Options de réponse (choix, vrai/faux) */
.options { display: grid; gap: 11px; margin-top: 6px; }
.options--serre { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }

.option {
  display: flex; align-items: center; gap: 13px;
  width: 100%;
  min-height: 58px;
  padding: 13px 18px;
  text-align: left;
  border-radius: 16px;
  border: 2px solid var(--page-bord);
  background: #fffdf7;
  color: var(--encre-sombre);
  font-family: var(--police-lecture);
  font-size: clamp(1.02rem, 2.8vw, 1.15rem);
  box-shadow: 0 3px 0 rgba(190, 160, 110, 0.4);
  transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease;
}
.option:hover { transform: translateY(-2px); border-color: var(--violet); }
.option__lettre {
  flex: 0 0 auto;
  width: 34px; height: 34px;
  display: grid; place-items: center;
  border-radius: 11px;
  background: rgba(139, 108, 240, 0.14);
  color: #5a3fc0;
  font-family: var(--police-titre);
  font-weight: 700;
  font-size: 0.98rem;
}
.option--choisie { border-color: var(--violet); background: #f4f0ff; box-shadow: 0 3px 0 var(--violet); }
.option--choisie .option__lettre { background: var(--violet); color: #fff; }
.option--juste { border-color: var(--juste); background: var(--juste-fond); box-shadow: 0 3px 0 var(--juste); }
.option--juste .option__lettre { background: var(--juste); color: #fff; }
.option--faux { border-color: var(--faux); background: var(--faux-fond); box-shadow: 0 3px 0 var(--faux); }
.option--faux .option__lettre { background: var(--faux); color: #fff; }
.option__marque { margin-left: auto; font-family: var(--police); font-weight: 700; font-size: 0.82rem; }

/* Champs de saisie */
.saisie {
  width: 100%;
  min-height: 60px;
  padding: 14px 18px;
  border-radius: 16px;
  border: 2px solid var(--page-bord);
  background: #fffdf7;
  color: var(--encre-sombre);
  font-family: var(--police-lecture);
  font-size: clamp(1.1rem, 3.2vw, 1.3rem);
  box-shadow: 0 2px 0 rgba(190, 160, 110, 0.35) inset;
}
.saisie::placeholder { color: #b8ac92; }
.saisie:focus { border-color: var(--violet); outline: none; box-shadow: 0 0 0 4px rgba(139, 108, 240, 0.18); }
.saisie--juste { border-color: var(--juste); background: var(--juste-fond); }
.saisie--faux { border-color: var(--faux); background: var(--faux-fond); }
.saisie--accents { border-color: var(--presque); background: var(--presque-fond); }
.saisie--courte { max-width: 340px; }
.saisie--mini { min-height: 50px; padding: 10px 13px; font-size: 1.1rem; text-align: center; }

.ligne-saisie {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  font-family: var(--police-lecture);
  font-size: clamp(1.15rem, 3.6vw, 1.5rem);
  line-height: 1.8;
  color: var(--encre-sombre);
}
.ligne-saisie .saisie { width: auto; min-width: 150px; flex: 0 1 auto; }

.tableau-conj { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.conj-ligne {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px;
  border-radius: 14px;
  background: rgba(190, 160, 110, 0.1);
}
.conj-ligne__pronom {
  flex: 0 0 92px;
  font-family: var(--police-lecture);
  font-weight: 700;
  color: var(--encre-moyenne);
  font-size: 0.98rem;
}
.conj-ligne .saisie { flex: 1; min-width: 0; }
.marque-case { flex: 0 0 auto; font-weight: 700; font-size: 0.95rem; width: 1.2em; text-align: center; }
.marque-case--juste { color: var(--juste); }
.marque-case--faux { color: var(--faux); }
.marque-case--accents { color: var(--presque); }

.depart {
  display: inline-block;
  padding: 10px 16px;
  margin-bottom: 16px;
  border-radius: 14px;
  background: rgba(190, 160, 110, 0.14);
  border-left: 4px solid var(--orange);
  font-family: var(--police-lecture);
  font-size: clamp(1.1rem, 3.2vw, 1.35rem);
  color: var(--encre-sombre);
}
.exemple {
  margin-top: 12px;
  font-size: 0.88rem;
  color: var(--encre-douce);
  font-style: italic;
}

/* Colonnes de tri */
.tri { display: grid; gap: 14px; }
.reserve {
  display: flex; flex-wrap: wrap; gap: 9px;
  min-height: 62px;
  padding: 12px;
  border-radius: 18px;
  border: 2px dashed var(--page-bord);
  background: rgba(190, 160, 110, 0.07);
}
.reserve__vide { color: var(--encre-douce); font-size: 0.88rem; align-self: center; }
.colonnes { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.colonne {
  padding: 12px;
  border-radius: 18px;
  border: 2px solid var(--page-bord);
  background: #fffdf7;
  min-height: 130px;
  display: flex; flex-direction: column; gap: 9px;
}
.colonne--survol { border-color: var(--violet); background: #f6f2ff; }
.colonne__titre { font-family: var(--police-titre); font-weight: 700; font-size: 1.02rem; color: var(--encre-sombre); }
.colonne__aide { font-size: 0.76rem; color: var(--encre-douce); margin-top: -4px; }
.colonne__zone { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; align-content: flex-start; }

.etiquette {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 10px 15px;
  border-radius: 14px;
  border: 2px solid #c9b48f;
  background: linear-gradient(170deg, #fffdf7, #f6ead3);
  color: var(--encre-sombre);
  font-family: var(--police-lecture);
  font-size: clamp(1rem, 2.8vw, 1.12rem);
  box-shadow: 0 3px 0 #c9b48f;
  touch-action: none;
  transition: transform 0.12s ease, box-shadow 0.15s ease;
}
.etiquette:hover { transform: translateY(-2px); }
.etiquette--prise { border-color: var(--violet); box-shadow: 0 3px 0 var(--violet), 0 0 0 4px rgba(139, 108, 240, 0.16); }
.etiquette--vole { position: fixed; z-index: 90; pointer-events: none; transform: scale(1.06) rotate(-2deg); box-shadow: 0 16px 30px rgba(0, 0, 0, 0.3); }
.etiquette--juste { border-color: var(--juste); box-shadow: 0 3px 0 var(--juste); background: var(--juste-fond); }
.etiquette--faux { border-color: var(--faux); box-shadow: 0 3px 0 var(--faux); background: var(--faux-fond); }
.etiquette__num {
  font-family: var(--police);
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--encre-douce);
  background: rgba(26, 22, 51, 0.08);
  border-radius: 7px;
  padding: 1px 6px;
}

/* Liste à ranger */
.rangee { display: flex; flex-direction: column; gap: 9px; }
.rangee__item { display: flex; align-items: center; gap: 10px; }
.rangee__item .etiquette { flex: 1; justify-content: space-between; }
.fleches { display: flex; flex-direction: column; gap: 3px; }
.fleche {
  width: 38px; height: 28px;
  display: grid; place-items: center;
  border-radius: 9px;
  border: 1px solid var(--page-bord);
  background: #fffdf7;
  color: var(--encre-moyenne);
}
.fleche:hover:not(:disabled) { background: #f3e9d6; color: var(--encre-sombre); }
.fleche:disabled { opacity: 0.3; cursor: not-allowed; }

/* Paires à relier */
.paires { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: start; }
.paires__col { display: flex; flex-direction: column; gap: 9px; }
.paires__titre { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--encre-douce); font-weight: 600; }
.paires__traits { align-self: stretch; }
.lien-btn {
  display: flex; align-items: center; gap: 9px;
  width: 100%;
  min-height: 54px;
  padding: 11px 14px;
  border-radius: 15px;
  border: 2px solid var(--page-bord);
  background: #fffdf7;
  color: var(--encre-sombre);
  font-family: var(--police-lecture);
  font-size: clamp(0.95rem, 2.6vw, 1.08rem);
  text-align: left;
  box-shadow: 0 3px 0 rgba(190, 160, 110, 0.4);
}
.lien-btn--actif { border-color: var(--violet); box-shadow: 0 3px 0 var(--violet); }
.lien-btn--relie { background: #f4f0ff; }
.lien-btn--juste { border-color: var(--juste); background: var(--juste-fond); box-shadow: 0 3px 0 var(--juste); }
.lien-btn--faux { border-color: var(--faux); background: var(--faux-fond); box-shadow: 0 3px 0 var(--faux); }
.pastille {
  width: 26px; height: 26px; flex: 0 0 auto;
  border-radius: 50%;
  display: grid; place-items: center;
  font-family: var(--police);
  font-size: 0.74rem;
  font-weight: 700;
  background: rgba(139, 108, 240, 0.16);
  color: #5a3fc0;
}

/* Page de dictionnaire */
.dico {
  border-radius: 18px;
  border: 1px solid var(--page-bord);
  background: #fffdf7;
  overflow: hidden;
  margin-bottom: 18px;
}
.dico__haut {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  padding: 11px 16px;
  background: linear-gradient(90deg, rgba(255, 194, 75, 0.2), rgba(139, 108, 240, 0.14));
  border-bottom: 2px solid var(--page-bord);
  font-family: var(--police-titre);
  font-weight: 700;
  font-size: 1.05rem;
  color: var(--encre-sombre);
}
.dico__num { font-family: var(--police); font-size: 0.76rem; font-weight: 600; color: var(--encre-douce); }
.dico__entrees { margin: 0; padding: 12px 16px; display: grid; gap: 9px; }
.dico__entree { display: grid; gap: 1px; }
.dico__mot { font-family: var(--police-lecture); font-weight: 700; color: var(--encre-sombre); }
.dico__mot span { font-family: var(--police); font-weight: 400; font-style: italic; color: var(--encre-douce); font-size: 0.8rem; margin-left: 6px; }
.dico__def { font-size: 0.92rem; color: var(--encre-moyenne); }
.dico__liste { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; }

/* --------------------------------------------------------------------------
   Barre d'exercice + retours
   -------------------------------------------------------------------------- */

.ex-haut {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.ex-haut__titre { font-family: var(--police-titre); font-weight: 700; font-size: 1.02rem; }
.ex-haut__sous { font-size: 0.78rem; color: var(--texte-faible); }
.ex-haut__jauge { flex: 1 1 120px; min-width: 100px; }
.points { display: flex; gap: 4px; }
.point { width: 8px; height: 8px; border-radius: 50%; background: rgba(255, 255, 255, 0.18); }
.point--plein { background: var(--or); }

.retour {
  margin-top: 16px;
  padding: 16px 18px;
  border-radius: 20px;
  display: flex;
  gap: 13px;
  align-items: flex-start;
  animation: monte 0.3s cubic-bezier(0.22, 1, 0.36, 1);
}
.retour--juste { background: var(--juste-fond); border: 2px solid var(--juste); }
.retour--presque { background: var(--presque-fond); border: 2px solid var(--presque); }
.retour--faux { background: var(--faux-fond); border: 2px solid var(--faux); }
.retour__icone {
  width: 40px; height: 40px; flex: 0 0 auto;
  border-radius: 13px;
  display: grid; place-items: center;
  font-size: 1.3rem;
  font-weight: 700;
  color: #fff;
}
.retour--juste .retour__icone { background: var(--juste); }
.retour--presque .retour__icone { background: var(--presque); }
.retour--faux .retour__icone { background: var(--faux); }
.retour__titre { font-family: var(--police-titre); font-weight: 700; font-size: 1.1rem; color: var(--encre-sombre); }
.retour__texte { color: var(--encre-moyenne); font-size: 0.98rem; margin-top: 2px; }
.retour__plus {
  margin-top: 10px;
  padding: 11px 14px;
  border-radius: 13px;
  background: rgba(255, 255, 255, 0.65);
  border-left: 4px solid var(--violet);
  font-size: 0.92rem;
  color: var(--encre-moyenne);
  white-space: pre-line;
}

.indice {
  margin-top: 14px;
  padding: 14px 16px;
  border-radius: 18px;
  background: rgba(255, 194, 75, 0.16);
  border: 1px dashed rgba(185, 106, 0, 0.5);
  display: flex; gap: 12px; align-items: flex-start;
  color: var(--encre-moyenne);
  font-size: 0.96rem;
  animation: monte 0.3s cubic-bezier(0.22, 1, 0.36, 1);
}
.indice strong { color: var(--encre-sombre); }

.actions {
  display: flex; flex-wrap: wrap; gap: 10px;
  margin-top: 18px;
  align-items: center;
}
.actions .btn { flex: 1 1 auto; min-width: 150px; }
.actions .btn--3 { flex: 0 0 auto; min-width: 0; }

/* --------------------------------------------------------------------------
   Fin de séance, récompenses
   -------------------------------------------------------------------------- */

.fanfare { text-align: center; padding: 20px 0 6px; }
.fanfare h1 { font-size: clamp(1.8rem, 6vw, 2.8rem); }
.fanfare p { color: var(--texte-doux); max-width: 44ch; margin: 10px auto 0; }

.anneau { position: relative; width: 150px; height: 150px; margin: 0 auto; }
.anneau svg { transform: rotate(-90deg); }
.anneau__val {
  position: absolute; inset: 0;
  display: grid; place-content: center; text-align: center;
}
.anneau__val b { font-family: var(--police-titre); font-size: 2.1rem; display: block; line-height: 1; }
.anneau__val span { font-size: 0.72rem; color: var(--texte-faible); }

.badge-vignette {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 16px 10px;
  border-radius: var(--r-m);
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--trait);
  text-align: center;
}
.badge-vignette--gagne { border-color: rgba(255, 194, 75, 0.45); background: rgba(255, 194, 75, 0.1); }
.badge-vignette--gagne .medaille { filter: none; }
.badge-vignette b { font-family: var(--police-titre); font-size: 0.95rem; }
.badge-vignette span { font-size: 0.76rem; color: var(--texte-faible); }
.medaille { width: 68px; height: 68px; filter: grayscale(1) opacity(0.4); }

.tresor-carte {
  display: flex; gap: 12px; align-items: center;
  padding: 14px;
  border-radius: var(--r-m);
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--trait);
}
.tresor-carte--vide { opacity: 0.45; }
.tresor-carte b { font-family: var(--police-titre); }
.tresor-carte p { margin: 2px 0 0; font-size: 0.82rem; color: var(--texte-doux); }

.coffre-zone { display: grid; place-items: center; gap: 16px; text-align: center; padding: 10px 0; }
.coffre-svg { width: min(260px, 70vw); }

/* --------------------------------------------------------------------------
   Progrès & espace parent
   -------------------------------------------------------------------------- */

.comp-ligne {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 13px 15px;
  border-radius: var(--r-m);
  background: rgba(255, 255, 255, 0.045);
  border: 1px solid var(--trait);
}
.comp-ligne__num {
  width: 34px; height: 34px;
  display: grid; place-items: center;
  border-radius: 11px;
  background: rgba(255, 255, 255, 0.08);
  font-family: var(--police-titre);
  font-weight: 700;
}
.comp-ligne b { font-size: 0.98rem; }
.comp-ligne__barre { margin-top: 6px; }
.comp-ligne__chiffre { font-variant-numeric: tabular-nums; font-family: var(--police-titre); font-size: 1.1rem; }

.histo { display: flex; align-items: flex-end; gap: 5px; height: 130px; padding-top: 10px; }
.histo__col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 5px; min-width: 0; }
.histo__barre {
  width: 100%;
  max-width: 34px;
  border-radius: 7px 7px 3px 3px;
  background: linear-gradient(180deg, var(--turquoise), rgba(47, 214, 196, 0.25));
  min-height: 3px;
  transition: height 0.6s cubic-bezier(0.22, 1, 0.36, 1);
}
.histo__barre--vide { background: rgba(255, 255, 255, 0.09); }
.histo__jour { font-size: 0.62rem; color: var(--texte-faible); white-space: nowrap; }
.histo__val { font-size: 0.66rem; color: var(--texte-doux); font-variant-numeric: tabular-nums; }

.tableau { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
.tableau th, .tableau td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--trait); }
.tableau th { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--texte-faible); font-weight: 600; }
.tableau td { font-variant-numeric: tabular-nums; }
.defile { overflow-x: auto; }

.code-saisie {
  display: flex; gap: 10px; justify-content: center;
}
.code-saisie input {
  width: 58px; height: 68px;
  text-align: center;
  font-family: var(--police-titre);
  font-size: 1.8rem;
  border-radius: 16px;
  border: 2px solid var(--trait-fort);
  background: rgba(255, 255, 255, 0.07);
  color: var(--texte);
}
.code-saisie input:focus { border-color: var(--or); outline: none; }

.avis {
  padding: 13px 16px;
  border-radius: var(--r-m);
  font-size: 0.92rem;
  border: 1px solid;
}
.avis--info { background: rgba(47, 214, 196, 0.1); border-color: rgba(47, 214, 196, 0.35); color: var(--texte); }
.avis--attention { background: rgba(255, 194, 75, 0.12); border-color: rgba(255, 194, 75, 0.4); color: var(--or-clair); }
.avis--erreur { background: rgba(255, 141, 168, 0.12); border-color: rgba(255, 141, 168, 0.4); color: var(--faux-nuit); }

.bascule {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  padding: 14px 16px;
  border-radius: var(--r-m);
  background: rgba(255, 255, 255, 0.045);
  border: 1px solid var(--trait);
  width: 100%;
  color: inherit;
  text-align: left;
}
.bascule__texte b { display: block; font-size: 0.98rem; }
.bascule__texte span { font-size: 0.8rem; color: var(--texte-faible); }
.interrupteur {
  flex: 0 0 auto;
  width: 56px; height: 32px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.14);
  border: 1px solid var(--trait-fort);
  position: relative;
  transition: background 0.2s ease;
}
.interrupteur::after {
  content: '';
  position: absolute;
  top: 3px; left: 3px;
  width: 24px; height: 24px;
  border-radius: 50%;
  background: var(--texte-faible);
  transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), background 0.2s ease;
}
.bascule[aria-pressed='true'] .interrupteur { background: rgba(47, 214, 196, 0.35); border-color: var(--turquoise); }
.bascule[aria-pressed='true'] .interrupteur::after { transform: translateX(24px); background: var(--turquoise-clair); }

/* --------------------------------------------------------------------------
   Fête : célébrations
   -------------------------------------------------------------------------- */

#fx { position: fixed; inset: 0; pointer-events: none; z-index: 80; }

.surgit {
  position: fixed;
  z-index: 95;
  inset: auto 0 calc(var(--nav-h) + 16px) 0;
  margin: 0 auto;
  width: min(420px, calc(100% - 28px));
  display: flex; align-items: center; gap: 13px;
  padding: 14px 17px;
  border-radius: 20px;
  background: linear-gradient(150deg, #fff3d6, #ffd98a);
  color: var(--nuit);
  box-shadow: 0 20px 44px rgba(0, 0, 0, 0.45);
  animation: surgit 0.45s cubic-bezier(0.22, 1, 0.36, 1);
}
.surgit b { font-family: var(--police-titre); display: block; }
.surgit span { font-size: 0.84rem; }
.surgit__icone { width: 46px; height: 46px; flex: 0 0 auto; }

@keyframes surgit {
  from { opacity: 0; transform: translateY(28px) scale(0.92); }
  to { opacity: 1; transform: none; }
}
@keyframes monte {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: none; }
}
@keyframes flotte {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-9px); }
}
@keyframes pulse-or {
  0%, 100% { filter: drop-shadow(0 0 0 rgba(255, 194, 75, 0)); }
  50% { filter: drop-shadow(0 0 16px rgba(255, 194, 75, 0.7)); }
}
.flotte { animation: flotte 4.5s ease-in-out infinite; }
.pulse { animation: pulse-or 2.6s ease-in-out infinite; }
.apparait { animation: monte 0.4s cubic-bezier(0.22, 1, 0.36, 1) both; }

/* --------------------------------------------------------------------------
   Écran de chargement et états vides
   -------------------------------------------------------------------------- */

.chargement { display: grid; place-items: center; gap: 18px; padding: 80px 20px; text-align: center; }
.chargement p { color: var(--texte-doux); }
.rotateur { width: 64px; height: 64px; animation: tourne 1.4s linear infinite; }
@keyframes tourne { to { transform: rotate(360deg); } }

.vide {
  text-align: center;
  padding: 40px 20px;
  color: var(--texte-doux);
  display: grid; gap: 12px; place-items: center;
}
.vide b { font-family: var(--police-titre); font-size: 1.15rem; color: var(--texte); }

/* --------------------------------------------------------------------------
   Grand écran
   -------------------------------------------------------------------------- */

@media (min-width: 860px) {
  .nav {
    position: sticky;
    top: var(--barre-h);
    bottom: auto;
    transform: none;
    left: auto;
    margin: 14px auto 0;
    width: min(620px, calc(100% - 28px));
    border-radius: 999px;
    border: 1px solid var(--trait);
    padding: 7px;
    background: rgba(20, 26, 69, 0.8);
  }
  .nav__item { flex-direction: row; gap: 7px; font-size: 0.82rem; border-radius: 999px; padding: 9px 8px; }
  .vue { padding-bottom: 48px; }
  .paires { grid-template-columns: 1fr 70px 1fr; }
}

@media (max-width: 520px) {
  .barre__id .barre__texte { display: none; }
  .compteur span.mot-compteur { display: none; }
  .paires { grid-template-columns: 1fr; }
  .paires__traits { display: none; }

/**
 * Crée un élément.
 * h('div.carte', { onclick: f }, 'texte', autreElement)
 * Le premier argument accepte « balise.classe1.classe2 ».
 */
function h(selecteur, attrs, ...enfants) {
  const [balise, ...classes] = String(selecteur).split('.');
  const el = document.createElement(balise || 'div');
  if (classes.length) el.className = classes.join(' ');
  if (attrs && (typeof attrs !== 'object' || Array.isArray(attrs) || attrs instanceof Node)) {
    enfants.unshift(attrs);
    attrs = null;
  }
  for (const [cle, valeur] of Object.entries(attrs || {})) {
    if (valeur === null || valeur === undefined || valeur === false) continue;
    if (cle === 'class') el.className = `${el.className} ${valeur}`.trim();
    else if (cle === 'html') el.innerHTML = valeur;
    else if (cle === 'style' && typeof valeur === 'object') Object.assign(el.style, valeur);
    else if (cle === 'data') for (const [d, v] of Object.entries(valeur)) el.dataset[d] = v;
    else if (cle.startsWith('on') && typeof valeur === 'function') {
      el.addEventListener(cle.slice(2), valeur);
    } else el.setAttribute(cle, valeur === true ? '' : valeur);

  ajouter(el, enfants);
  return el;

    if (enfant === null || enfant === undefined || enfant === false) continue;
    el.append(enfant instanceof Node ? enfant : document.createTextNode(String(enfant)));

function etoiles(n, graine = 1) {
  let out = '';
  let s = graine * 9301;
  for (let i = 0; i < n; i++) {
    s = (s * 9301 + 49297) % 233280;
    const x = 4 + ((s / 233280) * 312) % 312;
    s = (s * 9301 + 49297) % 233280;
    const y = 4 + ((s / 233280) * 90) % 90;
    s = (s * 9301 + 49297) % 233280;
    const r = 0.6 + ((s / 233280) * 1.4);
    out += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="#fff" opacity="${(0.25 + (r / 3)).toFixed(2)}"/>`;
  }
  return out;
}

/* ------------------------------------------------------------------ */

const NOEUDS = [
  { x: 60, y: 210 }, { x: 160, y: 148 }, { x: 268, y: 196 },
  { x: 372, y: 132 }, { x: 470, y: 188 }, { x: 568, y: 118 },
];

/** Le chemin de l'aventure, avec un nœud par monde. */
function constellation(mondes, etats) {
  const g = uid();
  let traits = '';
  for (let i = 1; i < NOEUDS.length; i++) {
    const a = NOEUDS[i - 1];
    const b = NOEUDS[i];
    const ouvert = etats[mondes[i].id]?.debloque;
    traits += `<path d="M${a.x} ${a.y} Q${(a.x + b.x) / 2} ${Math.min(a.y, b.y) - 36} ${b.x} ${b.y}"
      fill="none" stroke="${ouvert ? '#ffc24b' : 'rgba(255,255,255,.18)'}" stroke-width="3"
      stroke-dasharray="2 10" stroke-linecap="round"/>`;
  }
  const points = mondes
    .map((m, i) => {
      const n = NOEUDS[i];
      const etat = etats[m.id] || {};
      const couleur = etat.debloque ? m.palette.accent : '#5a5f8c';
      return `<g>
        <circle cx="${n.x}" cy="${n.y}" r="26" fill="rgba(7,10,34,.75)" stroke="${couleur}" stroke-width="3"/>
        ${etat.termine ? `<circle cx="${n.x}" cy="${n.y}" r="33" fill="none" stroke="#ffc24b" stroke-width="2" stroke-dasharray="4 6"/>` : ''}
        <text x="${n.x}" y="${n.y + 7}" text-anchor="middle" font-family="Baloo 2, sans-serif"
          font-size="20" font-weight="800" fill="${couleur}">${m.numero}</text>
        <text x="${n.x}" y="${n.y + 48}" text-anchor="middle" font-family="Lexend, sans-serif"
          font-size="12" fill="${etat.debloque ? '#e9ebff' : '#7d83bc'}">${m.titre.length > 20 ? `${m.titre.slice(0, 19)}…` : m.titre}</text>
      </g>`;
    })
    .join('');

/**
 * Sauvegarde locale de la progression de Thao.
 *
 * - Tout est enregistré sur l'appareil (localStorage). Aucun compte, aucune
 *   donnée envoyée sur Internet.
 * - La lecture est TOLÉRANTE : si la sauvegarde est absente, incomplète ou
 *   abîmée, on répare ce qui peut l'être et on repart d'un profil valide
 *   plutôt que de planter.

 *   optionnelle) sans jamais faire perdre une récompense déjà gagnée.
 */

const CLE = 'thao-aventure-v1';
const VERSION = 1;
const MAX_HISTORIQUE = 400;

const aujourdhui = () => new Date().toISOString().slice(0, 10);

/** Un profil neuf, prêt à l'emploi. */
function profilVide() {

  for (const m of MODULES) {
    competences[m.id] = {
      essais: 0,
      reussites: 0,
      score: 0,
      serie: 0,
      meilleureSerie: 0,
      derniers: [],
      niveauDifficulte: 1,
      formats: {},
      maitrise: 0,
      etat: 'nouvelle',
      secondes: 0,
    };
  }
  const mondes = {};
  MONDES.forEach((w, i) => {
    mondes[w.id] = { debloque: i === 0, termine: false, progression: 0, etoiles: 0 };
  });
  return {
    version: VERSION,
    prenom: 'Thao',
    cree: new Date().toISOString(),
    maj: new Date().toISOString(),
    xp: 0,
    etoiles: 0,
    niveau: 1,
    badges: [],
    tresors: [],
    coffresEnAttente: 0,
    mondes,
    competences,
    historique: [],
    revisions: [],
    missions: { terminees: 0, journal: [] },
    seance: null,
    jours: {},
    evaluation: { fait: false, resultats: {} },
    reglages: {
      sons: true,
      animations: true,
      grandePolice: false,
      contrasteFort: false,
    },
    parent: { code: null, dernierAcces: null },
    serieJours: { courant: 0, record: 0, dernierJour: null },
  };

const estObjet = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);

/**
 * Valide et répare un profil chargé.
 * @returns {{profil: object, reparations: string[]}}
 */
function valider(brut) {

        dernierJour: typeof brut.serieJours.dernierJour === 'string' ? brut.serieJours.dernierJour : null,
      }

/* ------------------------------------------------------------------ */
/* Accès au stockage du navigateur (sans planter côté Node)            */
/* ------------------------------------------------------------------ */

function stockage() {
  try {
    if (typeof localStorage === 'undefined') return null;
    const test = '__thao_test__';
    localStorage.setItem(test, '1');
    localStorage.removeItem(test);
    return localStorage;
  } catch {
    return null;
  }
}

function charger() {
  const ls = stockage();
  if (!ls) return { profil: profilVide(), reparations: [], disponible: false };
  let brut = null;
  try {
    const texte = ls.getItem(CLE);
    brut = texte ? JSON.parse(texte) : null;
  } catch {
    return {
      profil: profilVide(),
      reparations: ['sauvegarde abîmée : un nouveau profil a été créé'],
      disponible: true,
    };
  }
  const { profil, reparations } = valider(brut);
  return { profil, reparations, disponible: true, existait: !!brut };
}

function sauver(profil) {
  const ls = stockage();
  if (!ls) return false;
  try {
    profil.maj = new Date().toISOString();
    ls.setItem(CLE, JSON.stringify(profil));
    return true;
  } catch {
    return false;
  }
}

function effacer() {
  const ls = stockage();
  if (ls) ls.removeItem(CLE);
}

/* ------------------------------------------------------------------ */
/* Export / import                                                     */
/* ------------------------------------------------------------------ */

function exporter(profil) {
  return JSON.stringify({ application: 'thao-aventure', version: VERSION, profil }, null, 2);
}

function importer(texte) {
  let data;
  try {
    data = JSON.parse(texte);
  } catch {
    return { ok: false, erreur: 'Ce fichier n’est pas une sauvegarde Thao Aventure.' };
  }
  const brut = data && data.profil ? data.profil : data;
  if (!estObjet(brut)) return { ok: false, erreur: 'Le fichier ne contient pas de progression.' };
  const { profil, reparations } = valider(brut);
  return { ok: true, profil, reparations };
}

/* Fusion de deux sauvegardes                                          */
/* ------------------------------------------------------------------ */

/**
 * Fusionne deux profils sans perte : on garde le meilleur de chaque compteur,
 * l'union des badges et des trésors, et l'historique le plus riche.
 * Une récompense gagnée ne peut jamais disparaître à cause d'une fusion.
 */

  out.etoiles = Math.max(out.etoiles, autre.etoiles);
  out.niveau = Math.max(out.niveau, autre.niveau);
  out.coffresEnAttente = Math.max(out.coffresEnAttente, autre.coffresEnAttente);
  out.cree = out.cree < autre.cree ? out.cree : autre.cree;
  out.maj = plusRecent.maj;

    const x = out.mondes[id];
    const y = autre.mondes[id] || x;
    out.mondes[id] = {
      debloque: x.debloque || y.debloque,
      termine: x.termine || y.termine,
      progression: Math.max(x.progression, y.progression),
      etoiles: Math.max(x.etoiles, y.etoiles),
    };
  }

    out.competences[id] = {
      ...riche,
      essais: Math.max(x.essais, y.essais),
      reussites: Math.max(x.reussites, y.reussites),
      score: Math.max(x.score, y.score),
      meilleureSerie: Math.max(x.meilleureSerie, y.meilleureSerie),
      maitrise: Math.max(x.maitrise, y.maitrise),
      secondes: Math.max(x.secondes, y.secondes),
      niveauDifficulte: Math.max(x.niveauDifficulte, y.niveauDifficulte),
      formats: { ...x.formats, ...y.formats },
    };
  }

  const clefHist = (h) => `${h.id}|${h.date}`;
  const hist = new Map([...out.historique, ...autre.historique].map((h) => [clefHist(h), h]));
  out.historique = [...hist.values()]
    .sort((p, q) => String(p.date).localeCompare(String(q.date)))
    .slice(-MAX_HISTORIQUE);

  out.jours = { ...out.jours };
  for (const [jour, v] of Object.entries(autre.jours)) {
    const x = out.jours[jour];
    out.jours[jour] = x
      ? {
          secondes: Math.max(x.secondes, v.secondes),
          exercices: Math.max(x.exercices, v.exercices),
          justes: Math.max(x.justes, v.justes),
        }
      : v;
  }

  out.missions = {
    terminees: Math.max(out.missions.terminees, autre.missions.terminees),
    journal: [...out.missions.journal, ...autre.missions.journal]
      .filter((m, i, arr) => arr.findIndex((x) => x.date === m.date) === i)
      .slice(-120),
  };

  const revs = new Map([...out.revisions, ...autre.revisions].map((r) => [r.exId, r]));
  out.revisions = [...revs.values()];

  out.seance = plusRecent.seance;
  out.evaluation = out.evaluation.fait ? out.evaluation : autre.evaluation;
  out.reglages = plusRecent.reglages;
  out.parent = out.parent.code ? out.parent : autre.parent;
  out.serieJours = {
    courant: plusRecent.serieJours.courant,
    record: Math.max(out.serieJours.record, autre.serieJours.record),
    dernierJour: plusRecent.serieJours.dernierJour,
  };
  return out;
}

/** Enregistre le passage d'une journée (série de jours, temps passé). */
function marquerJour(profil, secondes = 0, exercices = 0, justes = 0) {
  const jour = aujourdhui();
  const j = profil.jours[jour] || { secondes: 0, exercices: 0, justes: 0 };
  j.secondes += secondes;
  j.exercices += exercices;
  j.justes += justes;
  profil.jours[jour] = j;

  const s = profil.serieJours;
  if (s.dernierJour !== jour) {
    const hier = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
    s.courant = s.dernierJour === hier ? s.courant + 1 : 1;
    s.dernierJour = jour;
    s.record = Math.max(s.record, s.courant);
  }
  return profil;
}

return { CLE, VERSION, profilVide, valider, charger, sauver, effacer, exporter, importer, fusionner, marquerJour };
});

/**
 * Récompenses : expérience, niveaux, badges, coffres et collection.
 *
 * Règle d'or : une récompense gagnée ne se perd JAMAIS. Une erreur ou une
 * mauvaise séance ne retire ni étoile, ni badge, ni trésor.
 */

const PALIERS = (() => {
  const liste = [0];
  let pas = 80;
  for (let i = 1; i <= 40; i++) {
    liste.push(liste[i - 1] + pas);
    pas += 20;
  }
  return liste;
})();

/** Niveau correspondant à une quantité d'expérience. */
function niveauPour(xp) {
  let n = 1;
  while (n < PALIERS.length && xp >= PALIERS[n]) n += 1;
  return n;
}

/** Infos d'affichage de la barre d'expérience. */
function jaugeNiveau(xp) {
  const niveau = niveauPour(xp);
  const bas = PALIERS[niveau - 1] ?? 0;
  const haut = PALIERS[niveau] ?? bas + 100;
  return {
    niveau,
    xp,
    bas,
    haut,
    dansNiveau: xp - bas,
    pourNiveau: haut - bas,
    pourcentage: Math.min(100, Math.round((100 * (xp - bas)) / (haut - bas))),
  };
}

function verifierBadges(profil) {
  const deja = new Set(profil.badges.map((b) => b.id));
  const gagnes = [];
  for (const badge of BADGES) {
    if (deja.has(badge.id)) continue;
    let ok = false;
    try {

    } catch {
      ok = false;

    if (ok) {
      profil.badges.push({ id: badge.id, date: new Date().toISOString() });

  }
  return gagnes;
}

  { id: 'verbo', nom: 'Sire Verbo', texte: 'Il connaît l’infinitif de tous les verbes du royaume.', couleur: '#D9C2FF' },
  { id: 'plume-or', nom: 'Plume d’or', texte: 'La plume de la gardienne de la bibliothèque.', couleur: '#FFC24B' },
];

/** Ouvre un coffre : donne un trésor pas encore possédé, et des étoiles. */
function ouvrirCoffre(profil) {
  if (profil.coffresEnAttente <= 0) return null;
  profil.coffresEnAttente -= 1;
  const possedes = new Set(profil.tresors.map((t) => t.id));
  const restants = TRESORS.filter((t) => !possedes.has(t.id));
  const bonusEtoiles = 3;
  profil.etoiles += bonusEtoiles;
  if (!restants.length) {
    return { tresor: null, etoiles: bonusEtoiles, xp: 20, deja: true };
  }
  const index = (profil.tresors.length * 7 + profil.historique.length) % restants.length;
  const tresor = restants[index];
  profil.tresors.push({ id: tresor.id, date: new Date().toISOString() });
  profil.xp += 20;
  return { tresor, etoiles: bonusEtoiles, xp: 20, deja: false };
}

/* ------------------------------------------------------------------ */
/* Attribution après un exercice                                       */
/* ------------------------------------------------------------------ */

/**
 * Ajoute les gains d'un exercice réussi.
 * @returns {{xp:number, etoiles:number, niveauGagne:number|null, badges:object[], coffre:boolean}}
 */
function recompenser(profil, exercice, resultat, premierEssai = true) {
  if (resultat.statut !== 'juste') {
    // Aucune perte : on encourage simplement l'effort.
    const badges = verifierBadges(profil);
    return { xp: 0, etoiles: 0, niveauGagne: null, badges, coffre: false };
  }
  const base = exercice.recompense;
  const xp = premierEssai ? base.xp : Math.max(5, Math.round(base.xp * 0.6));
  const etoiles = premierEssai ? base.etoiles : Math.max(1, base.etoiles - 1);
  const niveauAvant = niveauPour(profil.xp);
  profil.xp += xp;
  profil.etoiles += etoiles;
  const niveauApres = niveauPour(profil.xp);
  profil.niveau = niveauApres;

  // Un coffre tous les 10 exercices réussis.
  const justes = profil.historique.filter((h) => h.statut === 'juste').length;
  let coffre = false;
  if (justes > 0 && justes % 10 === 0) {
    profil.coffresEnAttente += 1;
    coffre = true;
  }

  const badges = verifierBadges(profil);
  return {
    xp,
    etoiles,
    niveauGagne: niveauApres > niveauAvant ? niveauApres : null,
    badges,
    coffre,
  };
}

return { TITRES_NIVEAU, BADGES, BADGE_PAR_ID, TRESORS, niveauPour, jaugeNiveau, titreNiveau, verifierBadges, ouvrirCoffre, recompenser };
});

__def("src/core/progression.js", function (__exports) {
/**
 * Progression adaptative.
 *
 * Idée pédagogique : une compétence n'est jamais déclarée « maîtrisée » sur
 * une seule bonne réponse. Il faut plusieurs réussites, sur plusieurs FORMATS
 * d'exercice différents, et au moins deux réussites sur des exercices
 * difficiles. À l'inverse, une erreur ne fait jamais perdre de progression :
 * elle place simplement l'exercice dans la file de révision.
 */

const { BANQUE, PAR_MODULE, PAR_MONDE } = __charger("data/bank/index.js");
const { MODULES, MONDES, MONDE_PAR_ID } = __charger("data/modules.js");

const FENETRE = 8; // on regarde les 8 dernières réponses d'une compétence
const MAX_REVISIONS = 40;

const ETATS = {
  nouvelle: { libelle: 'Pas encore commencé', couleur: 'neutre', ordre: 4 },
  'en-cours': { libelle: 'En cours d’apprentissage', couleur: 'cours', ordre: 2 },
  fragile: { libelle: 'À retravailler', couleur: 'fragile', ordre: 1 },
  maitrisee: { libelle: 'Maîtrisée', couleur: 'maitrise', ordre: 3 },
};

/** Moyenne des dernières réponses (0 → 1). */
function moyenneRecente(stat) {
  const d = stat.derniers.slice(-FENETRE);
  if (!d.length) return 0;
  return d.reduce((a, b) => a + b, 0) / d.length;
}

/** Calcule le pourcentage de maîtrise et l'état d'une compétence. */
function evaluerCompetence(stat, module) {
  const recent = moyenneRecente(stat);
  const formatsVus = Object.keys(stat.formats || {}).length;
  const formatsTotal = Math.max(1, (PAR_MODULE[module] || []).reduce((s, e, i, arr) => (arr.findIndex((x) => x.format === e.format) === i ? s + 1 : s), 0));
  const couverture = Math.min(1, formatsVus / Math.min(4, formatsTotal));
  const volume = Math.min(1, stat.essais / 8);
  const durs = stat.formats ? Object.values(stat.formats).reduce((n, f) => n + (f.dur || 0), 0) : 0;

  const maitrise = Math.round(100 * recent * (0.55 + 0.25 * couverture + 0.2 * volume));

  let etat = 'nouvelle';
  if (stat.essais === 0) etat = 'nouvelle';
  else if (recent >= 0.8 && stat.essais >= 6 && formatsVus >= 3 && durs >= 2) etat = 'maitrisee';
  else if (recent < 0.5 && stat.essais >= 3) etat = 'fragile';
  else etat = 'en-cours';

  return { maitrise: Math.min(100, maitrise), etat, recent, formatsVus, durs };
}

/**
 * Enregistre une réponse et met à jour la progression.
 * @param {object} profil
 * @param {object} exercice
 * @param {object} resultat  sortie de corriger()
 * @param {object} info      { essais, premierEssai, secondes }
 */
function enregistrerReponse(profil, exercice, resultat, info = {}) {
  const stat = profil.competences[exercice.competence];
  if (!stat) return { profil, nouvelEtat: null };

  const premier = info.premierEssai !== false;
  const reussi = resultat.statut === 'juste';
  const valeur = reussi ? (premier ? 1 : 0.6) : resultat.statut === 'presque' ? 0.3 : 0;

  stat.essais += 1;
  if (reussi) stat.reussites += 1;
  stat.score += valeur;
  stat.derniers = [...stat.derniers, valeur].slice(-12);
  stat.serie = reussi ? stat.serie + 1 : 0;
  stat.meilleureSerie = Math.max(stat.meilleureSerie, stat.serie);
  stat.secondes += info.secondes || 0;

  const f = stat.formats[exercice.format] || { essais: 0, reussites: 0, dur: 0 };
  f.essais += 1;
  if (reussi) {
    f.reussites += 1;
    if (exercice.difficulte === 3) f.dur += 1;
  }
  stat.formats[exercice.format] = f;

  // Difficulté adaptative : deux réussites d'affilée du premier coup → on monte.
  if (reussi && premier) {
    stat.montees = (stat.montees || 0) + 1;
    stat.descentes = 0;
    if (stat.montees >= 2 && stat.niveauDifficulte < 3) {
      stat.niveauDifficulte += 1;
      stat.montees = 0;
    }
  } else if (!reussi) {
    stat.descentes = (stat.descentes || 0) + 1;
    stat.montees = 0;
    if (stat.descentes >= 2 && stat.niveauDifficulte > 1) {
      stat.niveauDifficulte -= 1;
      stat.descentes = 0;
    }
  }

  const avant = stat.etat;
  const bilan = evaluerCompetence(stat, exercice.competence);
  stat.maitrise = bilan.maitrise;
  stat.etat = bilan.etat;

  // Historique
  profil.historique.push({
    id: exercice.id,
    module: exercice.module,
    format: exercice.format,
    difficulte: exercice.difficulte,
    statut: resultat.statut,
    essais: info.essais || 1,
    secondes: info.secondes || 0,
    date: new Date().toISOString(),
  });
  if (profil.historique.length > 400) profil.historique = profil.historique.slice(-400);

  // File de révision : une erreur revient plus tard, jamais tout de suite.
  if (!reussi) {
    const demain = new Date(Date.now() + 20 * 3600 * 1000).toISOString();
    profil.revisions = [
      ...profil.revisions.filter((r) => r.exId !== exercice.id),
      { exId: exercice.id, competence: exercice.competence, revoirLe: demain },
    ].slice(-MAX_REVISIONS);
  } else if (premier) {
    profil.revisions = profil.revisions.filter((r) => r.exId !== exercice.id);
  }

  return {
    profil,
    nouvelEtat: stat.etat !== avant ? stat.etat : null,
    maitrise: stat.maitrise,
  };
}

/* ------------------------------------------------------------------ */
/* Choix des exercices                                                 */
/* ------------------------------------------------------------------ */

/** Les ids vus récemment, pour éviter de reposer la même question. */
function vusRecemment(profil, combien = 60) {
  return new Set(profil.historique.slice(-combien).map((h) => h.id));
}

/** Révisions arrivées à échéance. */
function revisionsDues(profil, maintenant = Date.now()) {
  return profil.revisions.filter((r) => new Date(r.revoirLe).getTime() <= maintenant);
}

/**
 * Choisit une série d'exercices adaptée à Thao.
 * @param {object} profil
 * @param {object} opts { module, monde, n, difficulte, formats, eviter }
 */
function choisirExercices(profil, opts = {}) {
  const n = opts.n || 8;
  let pool = BANQUE;
  if (opts.module) pool = PAR_MODULE[opts.module] || [];
  else if (opts.monde) pool = PAR_MONDE[opts.monde] || [];
  if (opts.formats && opts.formats.length) pool = pool.filter((e) => opts.formats.includes(e.format));
  if (!pool.length) return [];

  const vus = vusRecemment(profil, opts.memoire ?? 60);
  const eviter = new Set(opts.eviter || []);
  const choix = [];
  const pris = new Set();
  const comptesFormat = {};
  // On ne veut pas huit fois le même type d'exercice dans une séance.
  const maxParFormat = opts.maxParFormat ?? 2;

  const ajouter = (e, strict = true) => {
    if (!e || pris.has(e.id) || eviter.has(e.id)) return false;
    if (strict && (comptesFormat[e.format] || 0) >= maxParFormat) return false;
    pris.add(e.id);
    comptesFormat[e.format] = (comptesFormat[e.format] || 0) + 1;
    choix.push(e);
    return true;
  };

  // 1. Les révisions dues, en priorité (mais au maximum un tiers de la séance).
  const maxRevisions = Math.max(1, Math.floor(n / 3));
  for (const r of revisionsDues(profil)) {
    if (choix.length >= maxRevisions) break;
    const e = pool.find((x) => x.id === r.exId);
    if (e) ajouter(e, false);
  }

  // 2. Le reste : difficulté visée par compétence, formats pas encore vus d'abord.
  const scoreDe = (e) => {
    const stat = profil.competences[e.competence] || { niveauDifficulte: 1, formats: {} };
    const cible = opts.difficulte || stat.niveauDifficulte;
    let s = 0;
    s -= Math.abs(e.difficulte - cible) * 10; // proche de la difficulté visée
    if (!stat.formats[e.format]) s += 8; // format nouveau : on découvre
    else s -= Math.min(6, stat.formats[e.format].essais); // format déjà beaucoup vu
    if (vus.has(e.id)) s -= 40; // déjà posé très récemment
    if (stat.etat === 'fragile' && e.difficulte === 1) s += 6; // on rassure
    return s;
  };

  const restants = pool
    .filter((e) => !pris.has(e.id) && !eviter.has(e.id))
    .map((e) => ({ e, s: scoreDe(e), h: hachage(e.id + (profil.historique.length || 0)) }))
    .sort((a, b) => b.s - a.s || a.h - b.h);

  for (const { e } of restants) {
    if (choix.length >= n) break;
    ajouter(e);
  }
  // S'il manque encore des exercices (peu de formats disponibles), on relâche.
  if (choix.length < n) {
    for (const { e } of restants) {
      if (choix.length >= n) break;
      ajouter(e, false);
    }
  }
  return choix;
}

/** Petit hachage stable pour départager sans vrai hasard. */
function hachage(texte) {
  let h = 0;
  for (let i = 0; i < texte.length; i++) h = (Math.imul(h, 31) + texte.charCodeAt(i)) | 0;
  return Math.abs(h) % 1000;
}

/* ------------------------------------------------------------------ */
/* Mondes : déblocage et progression                                   */
/* ------------------------------------------------------------------ */

/** Pourcentage de progression d'un monde = moyenne de la maîtrise de ses modules. */
function progressionMonde(profil, mondeId) {
  const monde = MONDE_PAR_ID[mondeId];
  if (!monde) return 0;
  const vals = monde.modules.map((m) => profil.competences[m]?.maitrise || 0);
  return Math.round(vals.reduce((a, b) => a + b, 0) / vals.length);
}

/** Met à jour l'état des mondes : progression, achèvement, déblocage du suivant. */
function majMondes(profil) {
  const debloques = [];
  MONDES.forEach((w, i) => {
    const etat = profil.mondes[w.id];
    etat.progression = progressionMonde(profil, w.id);
    const tousMaitrises = w.modules.every((m) => profil.competences[m]?.etat === 'maitrisee');
    if (tousMaitrises && !etat.termine) {
      etat.termine = true;
      profil.coffresEnAttente += 1;
    }
    etat.etoiles = w.modules.reduce((n, m) => n + (profil.competences[m]?.reussites || 0), 0);
    // Le monde suivant s'ouvre dès que celui-ci est bien entamé (60 %).
    const suivant = MONDES[i + 1];
    if (suivant && etat.progression >= 60 && !profil.mondes[suivant.id].debloque) {
      profil.mondes[suivant.id].debloque = true;
      debloques.push(suivant);
    }
  });
  return debloques;
}

/* ------------------------------------------------------------------ */
/* Conseils                                                            */
/* ------------------------------------------------------------------ */

/** La compétence la plus utile à travailler maintenant. */
function prochaineCompetence(profil) {
  const classees = MODULES.map((m) => {
    const stat = profil.competences[m.id];
    const monde = profil.mondes[m.monde];
    return { module: m, stat, accessible: monde?.debloque };
  })
    .filter((x) => x.accessible)
    .sort((a, b) => {
      const oa = ETATS[a.stat.etat]?.ordre ?? 4;
      const ob = ETATS[b.stat.etat]?.ordre ?? 4;
      if (oa !== ob) return oa - ob;
      return a.stat.maitrise - b.stat.maitrise;
    });
  return classees[0]?.module || MODULES[0];
}

/** Petit bilan global, affiché sur l'accueil. */
function bilan(profil) {
  const comps = MODULES.map((m) => ({ id: m.id, titre: m.court, ...profil.competences[m.id] }));
  const maitrisees = comps.filter((c) => c.etat === 'maitrisee');
  const fragiles = comps.filter((c) => c.etat === 'fragile');
  const enCours = comps.filter((c) => c.etat === 'en-cours');
  const total = profil.historique.length;
  const justes = profil.historique.filter((h) => h.statut === 'juste').length;
  return {
    progressionGlobale: Math.round(comps.reduce((a, c) => a + c.maitrise, 0) / comps.length),
    maitrisees,
    fragiles,
    enCours,
    exercicesFaits: total,
    reussite: total ? Math.round((100 * justes) / total) : 0,
    mondesDebloques: Object.values(profil.mondes).filter((w) => w.debloque).length,
    prochaine: prochaineCompetence(profil),
  };
}

return { ETATS, evaluerCompetence, enregistrerReponse, revisionsDues, choisirExercices, progressionMonde, majMondes, prochaineCompetence, bilan };
});

__def("data/bank/index.js", function (__exports) {
/**
 * La banque d'exercices complète.
 *
 * Elle est construite une seule fois, de façon déterministe : même ordre,
 * mêmes identifiants, mêmes réponses à chaque chargement. On peut donc
 * l'auditer entièrement (voir tests/banque.test.js).
 */

const { construireM1 } = __charger("data/bank/m1.js");
const { construireM2 } = __charger("data/bank/m2.js");
const { construireM3 } = __charger("data/bank/m3.js");
const { construireM4 } = __charger("data/bank/m4.js");
const { construireM5 } = __charger("data/bank/m5.js");
const { construireM6 } = __charger("data/bank/m6.js");
const { construireM7 } = __charger("data/bank/m7.js");
const { construireM8 } = __charger("data/bank/m8.js");
const { construireM9 } = __charger("data/bank/m9.js");
const { MODULES, MODULE_PAR_ID, MONDES } = __charger("data/modules.js");

const CONSTRUCTEURS = {
  m1: construireM1,
  m2: construireM2,
  m3: construireM3,
  m4: construireM4,
  m5: construireM5,
  m6: construireM6,
  m7: construireM7,
  m8: construireM8,
  m9: construireM9,
};

function construire() {
  const tous = [];
  for (const m of MODULES) {
    const lot = CONSTRUCTEURS[m.id]();
    if (lot.length < 50) {
      throw new Error(`Le module ${m.id} ne contient que ${lot.length} exercices (50 minimum).`);
    }
    tous.push(...lot);
  }
  const vus = new Set();
  for (const e of tous) {
    if (vus.has(e.id)) throw new Error(`Identifiant d'exercice en double : ${e.id}`);
    vus.add(e.id);
  }
  return tous;
}

const BANQUE = construire();

const PAR_ID = new Map(BANQUE.map((e) => [e.id, e]));

const PAR_MODULE = (() => {
  const index = {};
  for (const e of BANQUE) {
    index[e.module] = index[e.module] || [];
    index[e.module].push(e);
  }
  return index;
})();

const PAR_MONDE = (() => {
  const index = {};
  for (const w of MONDES) {
    index[w.id] = w.modules.flatMap((m) => PAR_MODULE[m] || []);
  }
  return index;
})();

const FORMATS_PAR_MODULE = (() => {
  const index = {};
  for (const [mod, liste] of Object.entries(PAR_MODULE)) {
    index[mod] = [...new Set(liste.map((e) => e.format))];
  }
  return index;
})();

/** Statistiques de la banque, affichées dans l'espace parent. */
function statsBanque() {
  const parModule = Object.fromEntries(
    Object.entries(PAR_MODULE).map(([k, v]) => [k, v.length]),
  );
  const parDifficulte = { 1: 0, 2: 0, 3: 0 };
  const parType = {};
  for (const e of BANQUE) {
    parDifficulte[e.difficulte] += 1;
    parType[e.type] = (parType[e.type] || 0) + 1;
  }
  return {
    total: BANQUE.length,
    modules: parModule,
    difficultes: parDifficulte,
    types: parType,
    formats: Object.values(FORMATS_PAR_MODULE).reduce((n, f) => n + f.length, 0),
  };
}

function exerciceParId(id) {
  return PAR_ID.get(id) || null;
}

function titreModule(id) {
  return MODULE_PAR_ID[id]?.titre || id;
}

return { BANQUE, PAR_ID, PAR_MODULE, PAR_MONDE, FORMATS_PAR_MODULE, statsBanque, exerciceParId, titreModule };
});

/**
 * MODULE 1 — Reconnaître les noms et les déterminants.
 *
 * Toutes les réponses sont extraites de l'annotation grammaticale du corpus
 * (data/corpus/phrases.js) : elles ne sont jamais saisies à la main ici, donc
 * elles ne peuvent pas être en désaccord avec l'analyse de la phrase.
 */

const { PHRASES, phrasesPour } = __charger("data/corpus/phrases.js");
const { DETERMINANTS, NOMS_COMMUNS, TOUS_DETERMINANTS } = __charger("data/corpus/noms.js");

  return 2;

        type: 'clic-mots',

        question: { phrase: p.texte, tokens: tokensAffichage(p), source: p.id },
        reponse: {
          indices: p.noms,
          bravo: 'Bravo Thao ! Tu as trouvé tous les noms !',

          'Un nom désigne une personne, un animal, une chose ou un lieu. Essaie de mettre « le », « la » ou « une » devant le mot : si ça sonne juste, c’est souvent un nom.',

      }),
    );
  });

        reponse: { indices: p.dets, bravo: 'Parfait ! Tu repères très bien les déterminants.' },
        indice:

  const candidatsBlancs = phrasesPour('det')
    .map((p) => {
      const bons = p.dets.filter((i) => {
        const n = nomApres(p, i);
        return n && !VOYELLE.test(n.token.w) && p.tokens[i].w.length > 1;
      });
      return { p, bons };
    })
    .filter((c) => c.bons.length >= 2);

  melanger(candidatsBlancs, 'm1-blancs')
    .slice(0, 8)
    .forEach(({ p, bons }, i) => {
      const trous = bons.slice(0, 2);
      const champs = trous.map((idx) => {
        const n = nomApres(p, idx);
        const cle = `d${idx}`;
        const gn = `${n.token.genre}${n.token.nombre}`;
        return {
          cle,
          etiquette: `avant « ${n.token.w} »`,
          attendus: [...new Set([p.tokens[idx].w.toLowerCase(), ...DETERMINANTS[gn]])],
          gn,
        };
      });
      ex.push(
        exercice({
          id: `m1-complete-det-${String(i + 1).padStart(2, '0')}`,
          module: M,
          competence: C,
          format: 'complete-det',
          difficulte: p.niveau >= 3 ? 3 : 2,
          type: 'textes',
          consigne: 'Écris un déterminant qui convient dans chaque case.',
          question: {
            texteTrous: texteAvecBlancs(p, trous),
            champs: champs.map((c) => ({ cle: c.cle, etiquette: c.etiquette })),
            source: p.id,
          },
          reponse: {
            champs,
            bravo: 'Très bien ! Tes déterminants vont parfaitement avec les noms.',
          },
          indice:
            'Regarde le nom qui suit : est-il masculin ou féminin ? singulier ou pluriel ? Le déterminant doit s’accorder avec lui.',
          explication: `La phrase complète peut s’écrire : « ${p.texte} » — mais d’autres déterminants du même genre et du même nombre marchent aussi.`,
        }),
      );
    });

  /* ---- D. Le tri magique (noms / déterminants) --------------------- */
  const reservoirNoms = NOMS_COMMUNS.map((n) => n.mot);
  for (let i = 0; i < 7; i++) {
    const noms = piocher(reservoirNoms, 3, `m1-tri-n-${i}`);
    const dets = piocher(TOUS_DETERMINANTS, 3, `m1-tri-d-${i}`);
    const placement = {};
    noms.forEach((m) => { placement[m] = 'noms'; });
    dets.forEach((m) => { placement[m] = 'dets'; });
    ex.push(
      exercice({
        id: `m1-tri-${String(i + 1).padStart(2, '0')}`,
        module: M,
        competence: C,
        format: 'tri-noms-det',
        difficulte: i < 3 ? 1 : 2,
        type: 'colonnes',
        consigne: 'Range chaque mot dans la bonne colonne.',
        question: {
          mots: melanger([...noms, ...dets], `m1-tri-mix-${i}`),
          colonnes: [
            { id: 'noms', titre: 'Noms', aide: 'une chose, un animal, une personne' },
            { id: 'dets', titre: 'Déterminants', aide: 'le petit mot devant le nom' },
          ],
        },
        reponse: { placement, bravo: 'Tout est bien rangé, Thao !' },
        indice: 'Un déterminant ne peut pas être tout seul : il attend toujours un nom derrière lui.',
        explication: `Noms : ${enumerer(noms)}. Déterminants : ${enumerer(dets)}.`,
      }),
    );
  }

  /* ---- E. Le détective grammatical (petit texte) ------------------- */
  const paires = melanger(PHRASES.filter((p) => p.noms.length >= 2 && p.noms.length <= 3), 'm1-detective');
  for (let i = 0; i < 5; i++) {
    const a = paires[i * 2];
    const b = paires[i * 2 + 1];
    const tokens = [...tokensAffichage(a), ...tokensAffichage(b).map((t, j) => (j === 0 ? { ...t, glue: false } : t))];
    const indices = [...a.noms, ...b.noms.map((j) => j + a.tokens.length)];
    ex.push(
      exercice({
        id: `m1-detective-${String(i + 1).padStart(2, '0')}`,
        module: M,
        competence: C,
        format: 'detective',
        difficulte: 3,
        type: 'clic-mots',
        consigne: 'Mène l’enquête : clique sur TOUS les noms de ce petit texte.',
        question: {
          phrase: `${a.texte} ${b.texte}`,
          tokens,
          source: `${a.id}+${b.id}`,
          enquete: true,
        },
        reponse: { indices, bravo: 'Enquête réussie, détective Thao !' },
        indice: 'Il y a des noms dans les deux phrases. Relis-les une par une, lentement.',
        explication: `Il y avait ${indices.length} noms à trouver : ${enumerer(indices.map((j) => tokens[j].w))}.`,
      }),
    );
  }

  /* ---- F. Singulier ou pluriel ? ----------------------------------- */
  const pourNombre = piocher(NOMS_COMMUNS.filter((n) => n.pluriel !== n.mot), 8, 'm1-nombre');
  pourNombre.forEach((n, i) => {
    const pluriel = i % 2 === 1;
    const groupe = pluriel
      ? `${n.genre === 'f' ? 'des' : 'des'} ${n.pluriel}`
      : `${n.genre === 'f' ? 'une' : 'un'} ${n.mot}`;
    ex.push(
      exercice({
        id: `m1-nombre-${String(i + 1).padStart(2, '0')}`,
        module: M,
        competence: C,
        format: 'singulier-pluriel',
        difficulte: 1,
        type: 'choix',
        consigne: `Ce groupe de mots est-il au singulier ou au pluriel ?`,
        question: { groupe, options: ['Au singulier', 'Au pluriel'] },
        reponse: {
          index: pluriel ? 1 : 0,
          bravo: 'Exact ! Tu entends bien le nombre.',
          rate: 'Regarde la fin du nom et le déterminant qui l’annonce.',
        },
        indice: 'Au pluriel, il y a plusieurs choses : le déterminant devient les, des, ces… et le nom prend souvent un -s ou un -x.',
        explication: pluriel
          ? `« ${groupe} » est au PLURIEL : il y a plusieurs ${n.pluriel}.`
          : `« ${groupe} » est au SINGULIER : il n’y a qu’${n.genre === 'f' ? 'une' : 'un'} ${n.mot}.`,
      }),
    );
  });

  /* ---- G. Combien de noms ? ---------------------------------------- */
  melanger(PHRASES.filter((p) => p.noms.length >= 2 && p.noms.length <= 4), 'm1-combien')
    .slice(0, 5)
    .forEach((p, i) => {
      const n = p.noms.length;
      const options = ['1 nom', '2 noms', '3 noms', '4 noms'];
      ex.push(
        exercice({
          id: `m1-combien-${String(i + 1).padStart(2, '0')}`,
          module: M,
          competence: C,
          format: 'combien-noms',
          difficulte: 2,
          type: 'choix',
          consigne: 'Compte les noms, puis choisis la bonne réponse.',
          question: { phrase: p.texte, options, source: p.id },
          reponse: {
            index: n - 1,
            bravo: 'Compté juste !',
            rate: 'Recompte en montrant chaque nom avec ton doigt.',
          },
          indice: 'Attention : les adjectifs (petit, joli, rouge…) ne sont pas des noms.',
          explication: `Il y a ${n} noms : ${enumerer(p.noms.map((j) => p.tokens[j].w))}.`,
        }),
      );
    });

  return ex;
}
